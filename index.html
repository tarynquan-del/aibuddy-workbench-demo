ass=\"ratio-box\">\r\n                      \u003cspan class=\"ratio-box-label\">占比\u003c/span>\r\n                      \u003cdiv class=\"ratio-input-wrap\">\r\n                        \u003cinput class=\"name-field-input ratio-input\" type=\"number\" min=\"0\" max=\"100\" value=\"10\" aria-label=\"考试占比\" disabled>\r\n                        \u003cspan class=\"ratio-unit\">%\u003c/span>\r\n                      \u003c/div>\r\n                      \u003cspan class=\"quota-badge\">约 \u003cspan data-page-count>2\u003c/span> 张/页\u003c/span>\r\n                    \u003c/div>\r\n                  \u003c/div>\r\n                  \u003cdiv class=\"head-right\">\u003cspan class=\"kpi-collapsed\">点击率\u003cb>2.6%\u003c/b>\u003c/span>\u003cbutton type=\"button\" class=\"ios-switch active\" data-source-toggle role=\"switch\" aria-checked=\"true\" aria-label=\"考试\">\u003cspan class=\"ios-switch-knob\">\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"card-collapse-btn\" data-card-collapse aria-label=\"收起或展开\" aria-expanded=\"true\">\u003ci class=\"fa-solid fa-chevron-up\">\u003c/i>\u003c/button>\u003c/div>\r\n                \u003c/div>\r\n                \u003cdiv class=\"source-sub\">\r\n                  \u003cdiv class=\"kpi-inline\" aria-label=\"近7日数据\">\u003cspan class=\"off-note\">已关闭，以下为近 7 日累计\u003c/span>\u003cem>近7日合计\u003c/em>\u003cspan>看到人天\u003cb>690\u003c/b>\u003c/span>\u003cspan>点开人天\u003cb>18\u003c/b>\u003c/span>\u003cspan>点击率\u003cb>2.6%\u003c/b>\u003c/span>\u003c/div>\r\n                \u003c/div>\r\n              \u003c/div>\r\n            \u003c/article>\r\n\r\n          \u003c/div>\r\n        \u003c/section>\r\n\r\n      \u003c/div>\r\n\r\n      \u003cdiv id=\"viewTopics\" class=\"max-w-[1100px] mx-auto space-y-4\">\r\n        \u003cdiv class=\"bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden fade-up fade-up-0\">\r\n          \u003cdiv class=\"px-5 py-4 border-b border-slate-100 flex items-center justify-between\">\r\n            \u003ch2 class=\"text-lg font-black text-slate-800\">话题列表\u003c/h2>\r\n            \u003cspan class=\"field-help\" id=\"topicHint\">主推宜少，每批最多 2 张官方话题卡。取消主推不影响发帖和搜索；停用才不能再发帖，历史帖子保留原标签。\u003c/span>\r\n          \u003c/div>\r\n          \u003cdiv class=\"p-4\">\r\n            \u003cdiv class=\"page-table-wrap\">\r\n              \u003ctable class=\"content-table\">\r\n                \u003cthead>\r\n                  \u003ctr>\r\n                    \u003cth>话题\u003c/th>\u003cth>展示国家\u003c/th>\u003cth>创建方\u003c/th>\u003cth>状态\u003c/th>\u003cth>主推\u003c/th>\u003cth>帖子数\u003c/th>\u003cth style=\"text-align:right\">操作\u003c/th>\r\n                  \u003c/tr>\r\n                \u003c/thead>\r\n                \u003ctbody id=\"topicBody\">\u003c/tbody>\r\n              \u003c/table>\r\n            \u003c/div>\r\n          \u003c/div>\r\n        \u003c/div>\r\n      \u003c/div>\r\n\r\n      \u003cdiv id=\"viewTopicDetail\" class=\"max-w-[1100px] mx-auto hidden space-y-4\">\r\n        \u003cdiv id=\"topicReadonly\" class=\"info-banner blue hidden\">\r\n          \u003ci class=\"fa-solid fa-circle-info mt-0.5\">\u003c/i>\r\n          \u003cspan>全球话题由国家培训师只读。帖子操作仍按作者所在国，本国帖子可以精选和下架。\u003c/span>\r\n        \u003c/div>\r\n        \u003csection class=\"bg-white rounded-2xl border border-slate-100 shadow-sm p-5\">\r\n          \u003cdiv class=\"flex flex-wrap items-start justify-between gap-3\">\r\n            \u003cdiv>\r\n              \u003ch2 class=\"text-lg font-black text-slate-900\" id=\"detailTitle\">话题\u003c/h2>\r\n              \u003cp class=\"field-help mt-1\" id=\"detailBlurb\">\u003c/p>\r\n              \u003cp class=\"text-xs font-bold text-slate-500 mt-2\" id=\"detailMeta\">\u003c/p>\r\n            \u003c/div>\r\n            \u003cdiv class=\"flex flex-wrap gap-2\" id=\"detailActions\">\u003c/div>\r\n          \u003c/div>\r\n        \u003c/section>\r\n        \u003cdiv class=\"bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden\">\r\n          \u003cdiv class=\"px-5 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3\">\r\n            \u003ch2 class=\"text-lg font-black text-slate-800\">这个话题下的帖子\u003c/h2>\r\n            \u003cdiv class=\"flex flex-wrap gap-2 items-center\">\r\n              \u003cspan class=\"field-help\">按发布时间从新到旧\u003c/span>\r\n              \u003cselect id=\"detailStatus\" class=\"form-input bg-white text-sm font-bold\">\r\n                \u003coption value=\"all\">全部状态\u003c/option>\r\n                \u003coption value=\"已发布\">已发布\u003c/option>\r\n                \u003coption value=\"已精选\">已精选\u003c/option>\r\n                \u003coption value=\"已下架\">已下架\u003c/option>\r\n              \u003c/select>\r\n            \u003c/div>\r\n          \u003c/div>\r\n          \u003cdiv class=\"p-4\">\r\n            \u003cdiv class=\"page-table-wrap\">\r\n              \u003ctable class=\"content-table\">\r\n                \u003cthead>\r\n                  \u003ctr>\u003cth>标题\u003c/th>\u003cth>作者\u003c/th>\u003cth>国家\u003c/th>\u003cth>赞\u003c/th>\u003cth>评论\u003c/th>\u003cth>状态\u003c/th>\u003cth style=\"text-align:right\">操作\u003c/th>\u003c/tr>\r\n                \u003c/thead>\r\n                \u003ctbody id=\"detailPostBody\">\u003c/tbody>\r\n              \u003c/table>\r\n            \u003c/div>\r\n          \u003c/div>\r\n        \u003c/div>\r\n      \u003c/div>\r\n\r\n      \u003cdiv id=\"viewPosts\" class=\"max-w-[1100px] mx-auto hidden space-y-4\">\r\n        \u003cdiv class=\"flex flex-wrap items-center justify-between gap-3\">\r\n          \u003cp class=\"text-sm font-bold text-slate-500\" id=\"postStats\">今日新帖 2\u003c/p>\u003cbutton class=\"btn-primary\" data-review-pool>待人工复核（3）\u003c/button>\r\n        \u003c/div>\r\n        \u003cdiv class=\"bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden\">\r\n          \u003cdiv class=\"px-5 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3\">\r\n            \u003cdiv>\r\n              \u003ch2 class=\"text-lg font-black text-slate-800\">帖子管理\u003c/h2>\r\n              \u003cp class=\"field-help\">默认看列表。今日按打开后管的人所在时区计算。刷到不好的内容，搜到或筛到后下架。\u003c/p>\r\n            \u003c/div>\r\n            \u003cdiv class=\"flex flex-wrap gap-2\">\r\n              \u003cinput id=\"postSearch\" class=\"form-input bg-white text-sm font-bold w-full max-w-xs\" placeholder=\"搜标题或正文\">\r\n              \u003cselect id=\"topicFilter\" class=\"form-input bg-white text-sm font-bold\">\r\n                \u003coption value=\"all\">全部话题\u003c/option>\r\n              \u003c/select>\r\n              \u003cselect id=\"statusFilter\" class=\"form-input bg-white text-sm font-bold\">\r\n                \u003coption value=\"all\">全部状态\u003c/option>\r\n                \u003coption value=\"已发布\">已发布\u003c/option>\r\n                \u003coption value=\"已精选\">已精选\u003c/option>\r\n                \u003coption value=\"已下架\">已下架\u003c/option>\r\n                \u003coption value=\"已删除\">已删除\u003c/option>\r\n              \u003c/select>\r\n              \u003cselect id=\"countryFilter\" class=\"form-input bg-white text-sm font-bold\">\r\n                \u003coption value=\"all\">全部国家\u003c/option>\r\n                \u003coption value=\"菲律宾\">菲律宾\u003c/option>\r\n                \u003coption value=\"尼日利亚\">尼日利亚\u003c/option>\r\n              \u003c/select>\r\n            \u003c/div>\r\n          \u003c/div>\r\n          \u003cdiv class=\"p-4\">\r\n            \u003cp id=\"postSearchHint\" class=\"field-help\" hidden>\u003c/p>\r\n            \u003cdiv class=\"page-table-wrap\" id=\"postTableWrap\">\r\n              \u003ctable class=\"content-table\">\r\n                \u003cthead id=\"postHead\">\u003c/thead>\r\n                \u003ctbody id=\"postBody\">\u003c/tbody>\r\n              \u003c/table>\r\n            \u003c/div>\r\n          \u003c/div>\r\n        \u003c/div>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  \u003c/main>\r\n\r\n  \u003cdiv id=\"shellModal\" class=\"fixed inset-0 z-[80] hidden items-center justify-center modal-scrim\" style=\"padding:28px\">\r\n    \u003cdiv class=\"paper-modal md\">\r\n      \u003cdiv class=\"modal-head\">\r\n        \u003cdiv>\r\n          \u003ch3 class=\"modal-title\" id=\"confirmTitle\">确认\u003c/h3>\r\n          \u003cp class=\"modal-sub\" id=\"confirmSub\">\u003c/p>\r\n        \u003c/div>\r\n        \u003cbutton type=\"button\" data-close-modal class=\"modal-close\">\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\u003c/button>\r\n      \u003c/div>\r\n      \u003cdiv class=\"modal-foot\">\r\n        \u003cbutton type=\"button\" data-close-modal class=\"btn-secondary\">取消\u003c/button>\r\n        \u003cbutton type=\"button\" id=\"btnConfirmOk\" class=\"btn-primary\">确认\u003c/button>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\r\n  \u003cdiv id=\"shellDrawer\" class=\"drawer-hidden fixed inset-0 z-[70]\">\r\n    \u003cdiv data-close-drawer class=\"drawer-backdrop absolute inset-0 bg-black/40\">\u003c/div>\r\n    \u003caside class=\"drawer-panel absolute right-0 top-0 bottom-0 w-full max-w-2xl bg-white shadow-2xl flex flex-col\">\r\n      \u003cdiv class=\"brand-gradient h-1 w-full shrink-0\">\u003c/div>\r\n      \u003cdiv class=\"p-4 border-b border-slate-100 flex items-start justify-between gap-3 shrink-0\">\r\n        \u003cdiv>\r\n          \u003ch2 class=\"font-black text-base text-slate-900\" id=\"drawerTitle\">新建话题\u003c/h2>\r\n          \u003cp class=\"text-xs text-slate-500 mt-0.5\">保存后即可被发帖选用。主推后才会进内容流的官方话题卡。标题允许重复，不做重名校验\u003c/p>\r\n        \u003c/div>\r\n        \u003cbutton type=\"button\" data-close-drawer class=\"p-1.5 rounded-lg hover:bg-slate-100 text-slate-400\">\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\u003c/button>\r\n      \u003c/div>\r\n      \u003cdiv id=\"shellDrawerBody\" class=\"custom-scrollbar flex-1 min-h-0 overflow-y-auto p-4 space-y-4\">\r\n        \u003cdiv>\r\n          \u003clabel class=\"name-field-label\" for=\"actTitle\">标题 \u003cspan class=\"text-red-500\">*\u003c/span>\u003c/label>\r\n          \u003cinput id=\"actTitle\" class=\"name-field-input\" placeholder=\"话题标题\">\r\n        \u003c/div>\r\n        \u003cdiv>\r\n          \u003clabel class=\"field-label\" for=\"actBody\">说明 \u003cspan class=\"text-red-500\">*\u003c/span>\u003c/label>\r\n          \u003ctextarea id=\"actBody\" class=\"form-input w-full\" placeholder=\"写清这个话题让大家聊什么。不走 AI 预审\">\u003c/textarea>\r\n        \u003c/div>\r\n        \u003cdiv>\r\n          \u003cdiv class=\"field-label\">展示国家 \u003cspan class=\"text-red-500\">*\u003c/span>\u003c/div>\r\n          \u003cdiv id=\"topicScope\" class=\"flex flex-wrap gap-2\" data-chip-group>\r\n            \u003cbutton type=\"button\" class=\"cycle-chip active px-4 py-2 text-sm\" data-scope=\"PH\">PH 菲律宾\u003c/button>\r\n            \u003cbutton type=\"button\" class=\"cycle-chip px-4 py-2 text-sm\" data-scope=\"global\" id=\"scopeGlobal\">全球\u003c/button>\r\n          \u003c/div>\r\n          \u003cp class=\"field-help mt-2\" id=\"scopeHelp\">创建后不可改。国家培训师只能建本国话题。\u003c/p>\r\n        \u003c/div>\r\n        \u003cdiv class=\"flex items-center justify-between gap-3\">\r\n          \u003cdiv>\r\n            \u003cdiv class=\"field-label !mb-1\">主推\u003c/div>\r\n            \u003cp class=\"field-help\">打开后进入内容流官方话题卡。同一国家同时主推宜少。\u003c/p>\r\n          \u003c/div>\r\n          \u003cbutton type=\"button\" class=\"ios-switch\" id=\"topicPin\" role=\"switch\" aria-checked=\"false\">\u003cspan class=\"ios-switch-knob\">\u003c/span>\u003c/button>\r\n        \u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"p-4 border-t border-slate-100 shrink-0 flex justify-end gap-2\">\r\n        \u003cbutton type=\"button\" data-close-drawer class=\"btn-secondary\">取消\u003c/button>\r\n        \u003cbutton type=\"button\" id=\"btnSaveAct\" class=\"btn-primary\">保存\u003c/button>\r\n      \u003c/div>\r\n    \u003c/aside>\r\n  \u003c/div>\r\n\r\n  \u003cdiv id=\"postDrawer\" class=\"drawer-hidden fixed inset-0 z-[70]\">\r\n    \u003cdiv data-close-post class=\"drawer-backdrop absolute inset-0 bg-black/40\">\u003c/div>\r\n    \u003caside class=\"drawer-panel absolute right-0 top-0 bottom-0 w-full max-w-2xl bg-white shadow-2xl flex flex-col\">\r\n      \u003cdiv class=\"brand-gradient h-1 w-full shrink-0\">\u003c/div>\r\n      \u003cdiv class=\"p-4 border-b border-slate-100 flex items-start justify-between gap-3 shrink-0\">\r\n        \u003cdiv>\r\n          \u003ch2 class=\"font-black text-base text-slate-900\" id=\"postDrawerTitle\">详情\u003c/h2>\r\n          \u003cp class=\"text-xs text-slate-500 mt-0.5\" id=\"postDrawerSub\">\u003c/p>\r\n        \u003c/div>\r\n        \u003cbutton type=\"button\" data-close-post class=\"p-1.5 rounded-lg hover:bg-slate-100 text-slate-400\">\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\u003c/button>\r\n      \u003c/div>\r\n      \u003cdiv id=\"postDrawerBody\" class=\"custom-scrollbar flex-1 min-h-0 overflow-y-auto p-4 space-y-4\">\u003c/div>\r\n      \u003cdiv id=\"postDrawerFoot\" class=\"p-4 border-t border-slate-100 shrink-0 flex justify-end gap-2\">\u003c/div>\r\n      \u003ciframe id=\"reviewFrame\" title=\"安小检人工复核\">\u003c/iframe>\r\n    \u003c/aside>\r\n  \u003c/div>\r\n\r\n  \u003cdiv id=\"toast\" class=\"toast\">\u003c/div>\r\n\r\n  \u003cscript>\r\n    function openModal(id) {\r\n      const el = document.getElementById(id);\r\n      el.classList.remove(\"hidden\");\r\n      el.classList.add(\"flex\");\r\n    }\r\n    function closeModal(id) {\r\n      const el = document.getElementById(id);\r\n      el.classList.add(\"hidden\");\r\n      el.classList.remove(\"flex\");\r\n    }\r\n    function openDrawer(id) {\r\n      document.getElementById(id).classList.remove(\"drawer-hidden\");\r\n    }\r\n    function closeDrawer(id) {\r\n      document.getElementById(id).classList.add(\"drawer-hidden\");\r\n    }\r\n    function showToast(msg, type) {\r\n      const el = document.getElementById(\"toast\");\r\n      const icon = type === \"error\"\r\n        ? '\u003ci class=\"fa-solid fa-circle-exclamation text-red-400 mr-2\">\u003c/i>'\r\n        : '\u003ci class=\"fa-solid fa-circle-check text-emerald-400 mr-2\">\u003c/i>';\r\n      el.innerHTML = icon + msg;\r\n      el.classList.add(\"show\");\r\n      clearTimeout(showToast._t);\r\n      showToast._t = setTimeout(() => el.classList.remove(\"show\"), 2200);\r\n    }\r\n    function shellSetStep(step) {\r\n      const steps = document.querySelectorAll(\"#shellWizard .wizard-step\");\r\n      steps.forEach((el, i) => {\r\n        const n = i + 1;\r\n        el.classList.toggle(\"active\", n === step);\r\n        el.classList.toggle(\"done\", n \u003c step);\r\n      });\r\n      document.querySelectorAll(\"[data-step-panel]\").forEach((panel) => {\r\n        panel.classList.toggle(\"step-panel-hidden\", Number(panel.dataset.stepPanel) !== step);\r\n      });\r\n      const prev = document.getElementById(\"btnPrev\");\r\n      const next = document.getElementById(\"btnNext\");\r\n      if (prev) prev.classList.toggle(\"hidden\", step \u003c= 1);\r\n      if (next) next.classList.toggle(\"hidden\", steps.length > 0 && step >= steps.length);\r\n    }\r\n\r\n// Toggle 开关状态维护与 Apple/Google 体验融合\r\n    function setToggle(btn, on) {\r\n      btn.classList.toggle(\"active\", on);\r\n      btn.setAttribute(\"aria-checked\", on ? \"true\" : \"false\");\r\n      const card = btn.closest(\"[data-source-card]\");\r\n      if (card && btn.hasAttribute(\"data-source-toggle\")) {\r\n        card.classList.toggle(\"is-off\", !on);\r\n      }\r\n    }\r\n\r\n    function enabledCards() {\r\n      return [...document.querySelectorAll(\"[data-source-card]\")].filter((card) =>\r\n        card.querySelector(\"[data-source-toggle]\").classList.contains(\"active\")\r\n      );\r\n    }\r\n\r\n    function enabledRatioSum() {\r\n      return enabledCards().reduce((sum, card) => sum + (Number(card.querySelector(\".ratio-input\").value) || 0), 0);\r\n    }\r\n\r\n    // 重新平衡占比\r\n    function redistribute() {\r\n      const cards = enabledCards();\r\n      if (!cards.length) return;\r\n      const weights = cards.map((card) => Number(card.querySelector(\".ratio-input\").value) || 1);\r\n      const total = weights.reduce((a, b) => a + b, 0);\r\n      let used = 0;\r\n      cards.forEach((card, i) => {\r\n        const value = i === cards.length - 1 ? 100 - used : Math.round((weights[i] / total) * 100);\r\n        used += value;\r\n        card.querySelector(\".ratio-input\").value = value;\r\n      });\r\n    }\r\n\r\n    // 刷新页面卡片预估张数与进度条\r\n    function refreshPageCounts() {\r\n      const pageSize = 20;\r\n      document.querySelectorAll(\"[data-source-card]\").forEach((card) => {\r\n        const slot = card.querySelector(\"[data-page-count]\");\r\n        const on = card.querySelector(\"[data-source-toggle]\").classList.contains(\"active\");\r\n        if (slot && !on) slot.textContent = \"0\";\r\n      });\r\n\r\n      const cards = enabledCards();\r\n      const weights = cards.map((card) => Math.max(0, Number(card.querySelector(\".ratio-input\").value) || 0));\r\n      const total = weights.reduce((a, b) => a + b, 0);\r\n      if (!total) return;\r\n      const rows = cards.map((card, i) => {\r\n        const exact = pageSize * weights[i] / total;\r\n        return { card, n: Math.floor(exact), frac: exact - Math.floor(exact) };\r\n      });\r\n      let left = pageSize - rows.reduce((sum, row) => sum + row.n, 0);\r\n      [...rows].sort((a, b) => b.frac - a.frac).forEach((row) => {\r\n        if (left > 0) { row.n += 1; left -= 1; }\r\n      });\r\n      rows.forEach((row) => {\r\n        const slot = row.card.querySelector(\"[data-page-count]\");\r\n        if (slot) slot.textContent = String(row.n);\r\n      });\r\n      document.querySelectorAll(\"[data-course-like]\").forEach((row) => {\r\n        const card = row.closest(\"[data-source-card]\");\r\n        const n = card.querySelector(\"[data-page-count]\").textContent;\r\n        const off = row.classList.contains(\"is-off\") || n === \"0\";\r\n        const quota = row.querySelector(\"[data-like-quota]\");\r\n        if (quota) quota.textContent = off ? \"0 张\" : \"约 \" + n + \" 张\";\r\n      });\r\n    }\r\n\r\n    function refreshRatioSum() {\r\n      const sum = enabledRatioSum();\r\n      const el = document.getElementById(\"ratioSum\");\r\n      const wrap = document.getElementById(\"ratioSumWrap\");\r\n      const dot = document.getElementById(\"ratioSumDot\");\r\n      if (!el) return;\r\n      const ok = sum === 100;\r\n      el.textContent = ok ? \"合计 100%\" : (sum \u003c 100 ? \"合计 \" + sum + \"%，还差 \" + (100 - sum) + \"%\" : \"合计 \" + sum + \"%，超出 \" + (sum - 100) + \"%\");\r\n      if (wrap) {\r\n        wrap.className = \"inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-black border \" +\r\n          (ok ? \"bg-emerald-50 border-emerald-200 text-emerald-700\" : \"bg-rose-50 border-rose-200 text-rose-600\");\r\n      }\r\n      if (dot) {\r\n        dot.className = \"w-2 h-2 rounded-full \" + (ok ? \"bg-emerald-500\" : \"bg-rose-500\");\r\n      }\r\n      refreshPageCounts();\r\n      if (typeof refreshTierOrder === \"function\") refreshTierOrder();\r\n\r\n      const base = Math.max(sum, 100);\r\n      document.querySelectorAll(\"[data-source-card]\").forEach((card) => {\r\n        const on = card.querySelector(\"[data-source-toggle]\").classList.contains(\"active\");\r\n        const v = on ? (Number(card.querySelector(\".ratio-input\").value) || 0) : 0;\r\n        const seg = document.querySelector('#ratioBar [data-bar=\"' + card.dataset.source + '\"]');\r\n        if (!seg) return;\r\n        seg.style.width = (v / base * 100) + \"%\";\r\n        seg.classList.toggle(\"narrow\", v \u003c 15);\r\n        seg.textContent = v \u003c= 0 ? \"\" : (v \u003c 12 ? v + \"%\" : card.dataset.name + \" \" + v + \"%\");\r\n        seg.title = card.dataset.name + \" \" + v + \"%\";\r\n      });\r\n      document.getElementById(\"ratioBar\").classList.toggle(\"bad\", !ok);\r\n    }\r\n\r\n    // 推荐因子：序号（只给开启的行编号）、每行「约 N 张」与上下移按钮状态\r\n    function refreshOneTierList(listId, countSelector) {\r\n      const list = document.getElementById(listId);\r\n      if (!list) return;\r\n      const rows = [...list.querySelectorAll(\":scope > .tier-row\")];\r\n      let activeIdx = 0;\r\n      const slot = document.querySelector(countSelector);\r\n      const pageN = slot ? Number(slot.textContent) || 0 : 0;\r\n      const onRows = rows.filter((row) => !row.classList.contains(\"is-off\"));\r\n      rows.forEach((row, i) => {\r\n        const isOff = row.classList.contains(\"is-off\");\r\n        let quota = row.querySelector(\".tier-quota\");\r\n        if (!quota) {\r\n          quota = document.createElement(\"span\");\r\n          quota.className = \"quota-badge tier-quota\";\r\n          const sort = row.querySelector(\".tier-sort-group\");\r\n          if (sort) sort.before(quota);\r\n        }\r\n        const pos = onRows.indexOf(row);\r\n        quota.textContent = isOff || !onRows.length ? \"0 张\" : \"约 \" + (Math.floor(pageN / onRows.length) + (pos \u003c pageN % onRows.length ? 1 : 0)) + \" 张\";\r\n        const idx = row.querySelector(\".tier-index\");\r\n        if (idx) {\r\n          if (isOff) {\r\n            idx.textContent = \"–\";\r\n          } else {\r\n            activeIdx += 1;\r\n            idx.textContent = String(activeIdx);\r\n          }\r\n        }\r\n        const upBtn = row.querySelector(\"[data-tier-up]\");\r\n        const downBtn = row.querySelector(\"[data-tier-down]\");\r\n        if (upBtn) upBtn.disabled = i === 0;\r\n        if (downBtn) downBtn.disabled = i === rows.length - 1;\r\n      });\r\n    }\r\n\r\n    function refreshTierOrder() {\r\n      refreshOneTierList(\"tierList\", '[data-source=\"answer\"] [data-page-count]');\r\n      refreshOneTierList(\"expTierList\", '[data-source=\"experience\"] [data-page-count]');\r\n    }\r\n\r\n    function isEditing() {\r\n      return document.getElementById(\"viewConfig\").dataset.mode === \"edit\";\r\n    }\r\n\r\n    function syncTopActions() {\r\n      const isConfig = !document.getElementById(\"viewConfig\").classList.contains(\"hidden\");\r\n      const editing = isEditing();\r\n      document.getElementById(\"btnEdit\").classList.toggle(\"hidden\", !isConfig || editing);\r\n      document.getElementById(\"btnCancel\").classList.toggle(\"hidden\", !isConfig || !editing);\r\n      document.getElementById(\"btnSave\").classList.toggle(\"hidden\", !isConfig || !editing);\r\n    }\r\n\r\n    function captureSnapshot() {\r\n      return {\r\n        ratios: [...document.querySelectorAll(\"[data-source-card]\")].map((card) => ({\r\n          source: card.dataset.source,\r\n          on: card.querySelector(\"[data-source-toggle]\").classList.contains(\"active\"),\r\n          ratio: card.querySelector(\".ratio-input\").value\r\n        })),\r\n        tierOrder: [...document.querySelectorAll(\"#tierList .tier-row\")].map((row) => row.dataset.tier),\r\n        tiers: [...document.querySelectorAll(\"#tierList .tier-row\")].map((row) => ({\r\n          tier: row.dataset.tier,\r\n          on: !row.classList.contains(\"is-off\")\r\n        })),\r\n        expTierOrder: [...document.querySelectorAll(\"#expTierList .tier-row\")].map((row) => row.dataset.tier),\r\n        expTiers: [...document.querySelectorAll(\"#expTierList .tier-row\")].map((row) => ({\r\n          tier: row.dataset.tier,\r\n          on: !row.classList.contains(\"is-off\")\r\n        })),\r\n        courseLike: [...document.querySelectorAll(\"[data-course-like]\")].map((row) => ({\r\n          key: row.dataset.courseLike,\r\n          on: !row.classList.contains(\"is-off\")\r\n        })),\r\n        models: [...selectedModels]\r\n      };\r\n    }\r\n\r\n    function applySnapshot(snap) {\r\n      if (!snap) return;\r\n      snap.ratios.forEach((item) => {\r\n        const card = document.querySelector('[data-source=\"' + item.source + '\"]');\r\n        if (!card) return;\r\n        setToggle(card.querySelector(\"[data-source-toggle]\"), item.on);\r\n        card.querySelector(\".ratio-input\").value = item.ratio;\r\n      });\r\n      const list = document.getElementById(\"tierList\");\r\n      snap.tierOrder.forEach((tier) => {\r\n        const row = list.querySelector('[data-tier=\"' + tier + '\"]');\r\n        if (row) list.appendChild(row);\r\n      });\r\n      snap.tiers.forEach((item) => {\r\n        const row = document.querySelector('#tierList [data-tier=\"' + item.tier + '\"]');\r\n        if (!row) return;\r\n        setToggle(row.querySelector(\"[data-tier-toggle]\"), item.on);\r\n        row.classList.toggle(\"is-off\", !item.on);\r\n      });\r\n      const expList = document.getElementById(\"expTierList\");\r\n      (snap.expTierOrder || []).forEach((tier) => {\r\n        const row = expList && expList.querySelector('[data-tier=\"' + tier + '\"]');\r\n        if (row) expList.appendChild(row);\r\n      });\r\n      (snap.expTiers || []).forEach((item) => {\r\n        const row = document.querySelector('#expTierList [data-tier=\"' + item.tier + '\"]');\r\n        if (!row) return;\r\n        setToggle(row.querySelector(\"[data-tier-toggle]\"), item.on);\r\n        row.classList.toggle(\"is-off\", !item.on);\r\n      });\r\n      snap.courseLike.forEach((item) => {\r\n        const row = document.querySelector('[data-course-like=\"' + item.key + '\"]');\r\n        if (!row) return;\r\n        setToggle(row.querySelector(\"[data-course-like-toggle]\"), item.on);\r\n        row.classList.toggle(\"is-off\", !item.on);\r\n      });\r\n      selectedModels.clear();\r\n      snap.models.forEach((id) => selectedModels.add(id));\r\n      if (typeof renderModelTrigger === \"function\") {\r\n        renderModelTrigger();\r\n        renderModelList(document.getElementById(\"modelSearch\").value);\r\n      }\r\n      refreshRatioSum();\r\n    }\r\n\r\n    function setConfigMode(mode) {\r\n      const view = document.getElementById(\"viewConfig\");\r\n      view.dataset.mode = mode;\r\n      view.querySelectorAll(\".ratio-input\").forEach((el) => { el.disabled = mode !== \"edit\"; });\r\n      if (mode !== \"edit\" && typeof setModelOpen === \"function\") setModelOpen(false);\r\n      syncTopActions();\r\n    }\r\n\r\n    let configSnapshot = null;\r\n\r\n    document.getElementById(\"btnEdit\").addEventListener(\"click\", () => {\r\n      configSnapshot = captureSnapshot();\r\n      setConfigMode(\"edit\");\r\n    });\r\n    document.getElementById(\"btnCancel\").addEventListener(\"click\", () => {\r\n      applySnapshot(configSnapshot);\r\n      setConfigMode(\"view\");\r\n    });\r\n\r\n    // 输入框联动\r\n    document.getElementById(\"viewConfig\").addEventListener(\"input\", (e) => {\r\n      if (!isEditing()) return;\r\n      if (e.target.classList.contains(\"ratio-input\")) refreshRatioSum();\r\n    });\r\n\r\n    // 卡片收起 / 展开（默认全部展开）\r\n    document.getElementById(\"viewConfig\").addEventListener(\"click\", (e) => {\r\n      const head = e.target.closest(\".source-head\");\r\n      if (!head) return;\r\n      if (e.target.closest(\".ratio-box, .ios-switch\")) return;\r\n      const card = head.closest(\"[data-source-card]\");\r\n      const collapsed = card.classList.toggle(\"collapsed\");\r\n      const btn = card.querySelector(\"[data-card-collapse]\");\r\n      if (btn) btn.setAttribute(\"aria-expanded\", collapsed ? \"false\" : \"true\");\r\n    });\r\n\r\n    // 切换内容类型开关\r\n    document.getElementById(\"viewConfig\").addEventListener(\"click\", (e) => {\r\n      const btn = e.target.closest(\"[data-source-toggle]\");\r\n      if (!btn) return;\r\n      if (!isEditing()) return;\r\n      setToggle(btn, !btn.classList.contains(\"active\"));\r\n      redistribute();\r\n      refreshRatioSum();\r\n    });\r\n\r\n    document.getElementById(\"viewConfig\").addEventListener(\"click\", (e) => {\r\n      const toggle = e.target.closest(\"[data-course-like-toggle]\");\r\n      if (!toggle) return;\r\n      if (!isEditing()) return;\r\n      const on = !toggle.classList.contains(\"active\");\r\n      setToggle(toggle, on);\r\n      toggle.closest(\"[data-course-like]\").classList.toggle(\"is-off\", !on);\r\n      refreshPageCounts();\r\n    });\r\n\r\n    function bindTierList(list) {\r\n      if (!list) return;\r\n      list.addEventListener(\"click\", (e) => {\r\n        if (!isEditing()) return;\r\n        const toggle = e.target.closest(\"[data-tier-toggle]\");\r\n        if (toggle) {\r\n          const on = !toggle.classList.contains(\"active\");\r\n          setToggle(toggle, on);\r\n          const row = toggle.closest(\".tier-row\");\r\n          row.classList.toggle(\"is-off\", !on);\r\n          if (row.dataset.tier === \"hero\" && !on && typeof setModelOpen === \"function\") {\r\n            setModelOpen(false);\r\n          }\r\n          refreshTierOrder();\r\n          return;\r\n        }\r\n        const up = e.target.closest(\"[data-tier-up]\");\r\n        const down = e.target.closest(\"[data-tier-down]\");\r\n        const row = (up || down) && (up || down).closest(\".tier-row\");\r\n        if (!row) return;\r\n        const box = row.parentElement;\r\n        if (up && row.previousElementSibling) {\r\n          box.insertBefore(row, row.previousElementSibling);\r\n          refreshTierOrder();\r\n        }\r\n        if (down && row.nextElementSibling) {\r\n          box.insertBefore(row.nextElementSibling, row);\r\n          refreshTierOrder();\r\n        }\r\n      });\r\n    }\r\n    bindTierList(document.getElementById(\"tierList\"));\r\n    bindTierList(document.getElementById(\"expTierList\"));\r\n\r\n    // 保存配置\r\n    document.getElementById(\"btnSave\")?.addEventListener(\"click\", () => {\r\n      const sum = enabledRatioSum();\r\n      if (sum !== 100) {\r\n        showToast(\"开启类型合计为 \" + sum + \"%，需恰好 100% 才能保存\", \"error\");\r\n        return;\r\n      }\r\n      const answerOn = document.querySelector('[data-source=\"answer\"] [data-source-toggle]')?.classList.contains(\"active\");\r\n      const tierOn = [...document.querySelectorAll(\"#tierList [data-tier-toggle]\")].some((btn) => btn.classList.contains(\"active\"));\r\n      if (answerOn && !tierOn) {\r\n        showToast(\"金牌话术至少要保留一个开启的推荐因子\", \"error\");\r\n        return;\r\n      }\r\n      const expOn = document.querySelector('[data-source=\"experience\"] [data-source-toggle]')?.classList.contains(\"active\");\r\n      const expTierOn = [...document.querySelectorAll(\"#expTierList [data-tier-toggle]\")].some((btn) => btn.classList.contains(\"active\"));\r\n      if (expOn && !expTierOn) {\r\n        showToast(\"经验分享至少要保留一个开启的推荐因子\", \"error\");\r\n        return;\r\n      }\r\n      configSnapshot = captureSnapshot();\r\n      setConfigMode(\"view\");\r\n      showToast(\"已保存，学员明天起生效\");\r\n    });\r\n\r\n    refreshRatioSum();\r\n    refreshTierOrder();\r\n\r\n    // 机型多选器逻辑\r\n    const MODEL_GROUPS = [\r\n      { series: \"CAMON 系列\", models: [\r\n        { id: \"camon50ultra\", name: \"CAMON 50 Ultra 5G\", cat: \"高端\" },\r\n        { id: \"camon40pro\", name: \"CAMON 40 Pro 5G\", cat: \"高端\" },\r\n        { id: \"camon50\", name: \"CAMON 50\", cat: \"中端\" },\r\n        { id: \"camon50pro\", name: \"CAMON 50 Pro\", cat: \"中端\" },\r\n        { id: \"camon40\", name: \"CAMON 40\", cat: \"中端\" }\r\n      ]},\r\n      { series: \"POVA 系列\", models: [\r\n        { id: \"pova6pro\", name: \"POVA 6 Pro\", cat: \"中端\" },\r\n        { id: \"pova6\", name: \"POVA 6\", cat: \"中端\" }\r\n      ]},\r\n      { series: \"SPARK 系列\", models: [\r\n        { id: \"spark30\", name: \"SPARK 30\", cat: \"低端\" },\r\n        { id: \"spark20\", name: \"SPARK 20\", cat: \"低端\" }\r\n      ]}\r\n    ];\r\n    const selectedModels = new Set([\"camon50\"]);\r\n    function catClass(cat) { return cat === \"高端\" ? \"high\" : cat === \"中端\" ? \"mid\" : \"low\"; }\r\n    function modelById(id) {\r\n      for (const group of MODEL_GROUPS) {\r\n        const found = group.models.find((item) => item.id === id);\r\n        if (found) return Object.assign({ series: group.series }, found);\r\n      }\r\n      return null;\r\n    }\r\n    function renderModelTrigger() {\r\n      const box = document.getElementById(\"modelTriggerContent\");\r\n      const clear = document.getElementById(\"modelClear\");\r\n      if (!selectedModels.size) {\r\n        box.innerHTML = '\u003cspan class=\"text-xs font-bold text-slate-400\">搜索或选择机型\u003c/span>';\r\n        clear.classList.add(\"hidden\");\r\n        return;\r\n      }\r\n      clear.classList.remove(\"hidden\");\r\n      box.innerHTML = [...selectedModels].map((id) => {\r\n        const item = modelById(id);\r\n        return `\u003cspan class=\"picker-chip\">\u003cspan class=\"truncate\">${item.name}\u003c/span>\u003cspan class=\"cat-tag ${catClass(item.cat)}\">${item.cat}\u003c/span>\u003cbutton type=\"button\" data-remove-model=\"${id}\" aria-label=\"移除\">\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\u003c/button>\u003c/span>`;\r\n      }).join(\"\");\r\n    }\r\n    function renderModelList(keyword) {\r\n      const kw = (keyword || \"\").trim().toLowerCase();\r\n      const wrap = document.getElementById(\"modelList\");\r\n      let html = \"\";\r\n      let count = 0;\r\n      MODEL_GROUPS.forEach((group) => {\r\n        const rows = group.models.filter((item) => !kw || item.name.toLowerCase().includes(kw) || group.series.toLowerCase().includes(kw) || item.cat.includes(kw));\r\n        if (!rows.length) return;\r\n        count += rows.length;\r\n        html += `\u003cdiv class=\"px-2 py-1 text-[11px] font-black text-slate-400\">${group.series}\u003c/div>`;\r\n        rows.forEach((item) => {\r\n          const on = selectedModels.has(item.id);\r\n          html += `\u003cbutton type=\"button\" class=\"w-full px-2.5 py-1.5 rounded-lg flex items-center justify- n      document.getElementById(\"pageTitle\").innerHTML = `${titles[name][0]} \u003cspan class=\"ver-tag\">V2.0\u003c/span>`;\r\n      document.getElementById(\"pageSub\").textContent = titles[name][1];\r\n      document.getElementById(\"crumb\").hidden = name !== \"topicDetail\";\r\n      document.getElementById(\"btnNew\").classList.toggle(\"hidden\", name !== \"topics\");\r\n      if (typeof syncTopActions === \"function\") syncTopActions();\r\n      const target = name === \"topicDetail\" ? \"topics\" : name;\r\n      document.querySelectorAll(\".nav-sub\").forEach((btn) => {\r\n        const on = btn.dataset.view === target;\r\n        btn.classList.toggle(\"bg-indigo-50\", on);\r\n        btn.classList.toggle(\"text-indigo-600\", on);\r\n        btn.classList.toggle(\"text-slate-400\", !on);\r\n      });\r\n      const url = new URL(location.href);\r\n      url.searchParams.set(\"view\", name === \"topicDetail\" && openTopicId ? \"topicDetail&topic=\" + openTopicId : name);\r\n      if (window === window.top && /^https?:$/.test(location.protocol)) history.replaceState(null, \"\", url.pathname + \"?view=\" + (name === \"topicDetail\" ? \"topicDetail\" : name));\r\n    }\r\n\r\n    function renderTopics() {\r\n      refreshTopicStats();\r\n      const rows = visibleTopics();\r\n      document.getElementById(\"topicBody\").innerHTML = rows.map((item) => `\r\n        \u003ctr>\r\n          \u003ctd>\u003cbutton type=\"button\" class=\"font-black text-indigo-700 hover:underline\" data-open-topic=\"${item.id}\">${item.title}\u003c/button>\u003cdiv class=\"text-slate-500\">${item.blurb}\u003c/div>\u003c/td>\r\n          \u003ctd>${item.scope === \"全球\" ? \"全球\" : item.scope}\u003c/td>\r\n          \u003ctd>${item.owner}\u003c/td>\r\n          \u003ctd>${item.status === \"启用\" ? '\u003cspan class=\"badge published\">启用\u003c/span>' : '\u003cspan class=\"badge offline\">停用\u003c/span>'}\u003c/td>\r\n          \u003ctd>${pinCell(item)}\u003c/td>\r\n          \u003ctd>${item.postCount}\u003c/td>\r\n          \u003ctd style=\"text-align:right\">\u003cbutton type=\"button\" class=\"text-xs font-black text-indigo-600 hover:underline\" data-open-topic=\"${item.id}\">查看\u003c/button>\u003c/td>\r\n        \u003c/tr>`).join(\"\");\r\n      document.getElementById(\"topicHint\").textContent = role === \"country\"\r\n        ? \"你只能改本国话题。全球话题只读，本国帖子仍可精选和下架。\"\r\n        : \"主推宜少，每批最多 2 张官方话题卡。取消主推不影响发帖和搜索；停用才不能再发帖。\";\r\n    }\r\n\r\n    function renderDetail() {\r\n      const topic = topics.find((item) => item.id === openTopicId);\r\n      if (!topic) return;\r\n      refreshTopicStats();\r\n      const readonly = role === \"country\" && topic.scope === \"全球\";\r\n      document.getElementById(\"detailTitle\").textContent = topic.title;\r\n      document.getElementById(\"detailBlurb\").textContent = topic.blurb;\r\n      document.getElementById(\"detailMeta\").textContent = `${topic.scope === \"全球\" ? \"全球\" : topic.scope} · ${topic.owner} · ${topic.status}${topic.pin ? \" · 主推\" : \"\"}`;\r\n      document.getElementById(\"topicReadonly\").classList.toggle(\"hidden\", !readonly);\r\n      const actions = document.getElementById(\"detailActions\");\r\n      if (!canEditTopic(topic)) {\r\n        actions.innerHTML = topic.locked ? '\u003cspan class=\"field-help\">默认话题不可停用，展示国家不可改。\u003c/span>' : \"\";\r\n      } else {\r\n        actions.innerHTML = `\r\n          \u003cbutton type=\"button\" class=\"btn-secondary\" data-edit-topic=\"${topic.id}\">编辑\u003c/button>\r\n          \u003cbutton type=\"button\" class=\"btn-secondary\" data-pin-topic=\"${topic.id}\">${topic.pin ? \"取消主推\" : \"设为主推\"}\u003c/button>\r\n          \u003cbutton type=\"button\" class=\"btn-secondary\" data-toggle-topic=\"${topic.id}\">${topic.status === \"启用\" ? \"停用\" : \"启用\"}\u003c/button>`;\r\n      }\r\n      const status = document.getElementById(\"detailStatus\").value;\r\n      let rows = topicPosts(topic).filter((item) => matchStatus(item, status));\r\n      rows.sort((a, b) => detailSort === \"likes\" ? b.likes - a.likes : b.time - a.time);\r\n      document.getElementById(\"detailPostBody\").innerHTML = rows.map((item) => `\r\n        \u003ctr>\r\n          \u003ctd>\u003cb>${item.title}\u003c/b>\u003cdiv class=\"text-slate-500\">${item.tags.map((tag) => \"#\" + tag).join(\" \")}\u003c/div>\u003c/td>\r\n          \u003ctd>${item.author}\u003c/td>\u003ctd>${item.country}\u003c/td>\u003ctd>${item.likes}\u003c/td>\u003ctd>${item.comments}\u003c/td>\r\n          \u003ctd>${statusBadge(item)}\u003c/td>\r\n          \u003ctd style=\"text-align:right;white-space:nowrap\">${postOps(item)}\u003c/td>\r\n        \u003c/tr>`).join(\"\") || '\u003ctr>\u003ctd colspan=\"7\" class=\"text-center text-slate-400 py-8\">这个话题下还没有帖子\u003c/td>\u003c/tr>';\r\n    }\r\n\r\n    function fillPostFilters() {\r\n      const topicSel = document.getElementById(\"topicFilter\");\r\n      const countrySel = document.getElementById(\"countryFilter\");\r\n      if (topicSel) {\r\n        const names = [...new Set(visiblePosts().flatMap((item) => item.tags))];\r\n        const current = postTopic;\r\n        topicSel.innerHTML = '\u003coption value=\"all\">全部话题\u003c/option>' + names.map((name) => `\u003coption value=\"${escHtml(name)}\">${escHtml(name)}\u003c/option>`).join(\"\");\r\n        topicSel.value = names.includes(current) ? current : \"all\";\r\n        postTopic = topicSel.value;\r\n      }\r\n      if (countrySel) {\r\n        countrySel.classList.toggle(\"hidden\", role === \"country\");\r\n        if (role === \"country\") {\r\n          countrySel.value = \"菲律宾\";\r\n          postCountry = \"all\";\r\n        }\r\n      }\r\n    }\r\n    function renderPosts() {\r\n      document.querySelector(\"#viewPosts [data-review-pool]\").textContent=\"待人工复核（\"+reviewRows().filter(t=>t.status===\"待处理\").length+\"）\";\r\n      fillPostFilters();\r\n      const input = document.getElementById(\"postSearch\");\r\n      const hint = document.getElementById(\"postSearchHint\");\r\n      const wrap = document.getElementById(\"postTableWrap\");\r\n      const q = (input && input.value || \"\").trim().toLowerCase();\r\n      const rows = visiblePosts().filter((item) => {\r\n        if (q && !(item.title + item.body).toLowerCase().includes(q)) return false;\r\n        if (postTopic !== \"all\" && !item.tags.includes(postTopic)) return false;\r\n        if (role === \"hq\" && postCountry !== \"all\" && item.country !== postCountry) return false;\r\n        return matchStatus(item, postStatus);\r\n      });\r\n      const todayPosts = visiblePosts().filter((item) => item.today).length;\r\n      const stats = document.getElementById(\"postStats\");\r\n      if (stats) stats.textContent = \"今日新帖 \" + todayPosts + \"（按打开者当地时区）\";\r\n      if (hint) {\r\n        hint.hidden = rows.length > 0;\r\n        hint.textContent = rows.length ? \"\" : \"没有找到相关帖子\";\r\n      }\r\n      if (wrap) wrap.hidden = rows.length === 0;\r\n      document.getElementById(\"postHead\").innerHTML = '\u003ctr>\u003cth>标题\u003c/th>\u003cth>话题\u003c/th>\u003cth>作者\u003c/th>\u003cth>国家\u003c/th>\u003cth>赞\u003c/th>\u003cth>状态\u003c/th>\u003cth style=\"text-align:right\">操作\u003c/th>\u003c/tr>';\r\n      document.getElementById(\"postBody\").innerHTML = rows.map((item) => `\u003ctr>\r\n          \u003ctd>\u003cb>${escHtml(item.title)}\u003c/b>${reviewHint(item.id)}\u003cdiv class=\"text-slate-500\">${escHtml(item.body)}\u003c/div>\u003c/td>\r\n          \u003ctd>${item.tags.map((tag) => \"#\" + escHtml(tag)).join(\" \")}\u003c/td>\r\n          \u003ctd>${escHtml(item.author)}\u003c/td>\u003ctd>${escHtml(item.country)}\u003c/td>\u003ctd>${item.likes}\u003c/td>\r\n          \u003ctd>${statusBadge(item)}\u003c/td>\r\n          \u003ctd style=\"text-align:right;white-space:nowrap\">${postOps(item)}\u003c/td>\r\n        \u003c/tr>`).join(\"\") || '\u003ctr>\u003ctd colspan=\"7\" class=\"text-center text-slate-400 py-8\">没有找到相关帖子\u003c/td>\u003c/tr>';\r\n      if (currentView === \"topicDetail\") renderDetail();\r\n      const drawer = document.getElementById(\"postDrawer\");\r\n      if (openPostId && drawer && !drawer.classList.contains(\"drawer-hidden\")) renderPostDrawer(openPostId);\r\n    }\r\n\r\n    function findContent(id) {\r\n      return posts.find((item) => item.id === id) || comments.find((item) => item.id === id);\r\n    }\r\n    function commentMod(c) {\r\n      const review = reviewRecords.find(item=>item.id===c.id && (role===\"hq\" || c.country===\"菲律宾\"));\r\n      const reviewAction=review ? '\u003cbutton class=\"rv-link\" data-review-id=\"'+c.id+'\">'+(review.status===\"待处理\"?\"去复核\":\"查看复核结果\")+'\u003c/button>' : \"\";\r\n      if(reviewAction && c.status!==\"已发布\" && c.status!==\"已下架\") return reviewAction;\r\n      if (role === \"country\" && c.country !== \"菲律宾\") return \"\";\r\n      if (c.status === \"已发布\") return reviewAction + `\u003cbutton type=\"button\" class=\"text-xs font-black text-slate-600\" data-off-comment=\"${c.id}\">下架\u003c/button>`;\r\n      if (c.status === \"已下架\") return reviewAction;\r\n      return \"\";\r\n    }\r\n    function renderPostDrawer(id) {\r\n      const post = posts.find((item) => item.id === id);\r\n      if (!post) return;\r\n      openPostId = id;\r\n      document.getElementById(\"postDrawerTitle\").textContent = post.title;\r\n      document.getElementById(\"postDrawerSub\").textContent = \"和用户端同一套详情。评论可以盖楼，不好的内容在这里下架。\";\r\n      const tops = comments.filter((c) => c.postId === post.id && !c.parentId);\r\n      const thread = tops.map((c) => {\r\n        const replies = comments.filter((r) => r.parentId === c.id).map((r) => `\r\n          \u003cdiv class=\"ml-10 mt-2 border-l-2 border-slate-200 pl-3\" data-comment-id=\"${r.id}\">\r\n            \u003cdiv class=\"flex items-center justify-between gap-2\">\r\n              \u003cdiv class=\"text-xs font-black text-slate-800\">${escHtml(r.author)}\u003c/div>\r\n              \u003cdiv class=\"flex items-center gap-2\">${statusBadge(r)}${commentMod(r)}\u003c/div>\r\n            \u003c/div>\r\n            \u003cdiv class=\"text-sm text-slate-700 mt-1\">${escHtml(r.body)}\u003c/div>\r\n          \u003c/div>`).join(\"\");\r\n        return `\u003cdiv class=\"py-3 border-b border-slate-100\">\r\n          \u003cdiv class=\"comment-content\" data-comment-id=\"${c.id}\">\u003cdiv class=\"flex items-center justify-between gap-2\">\r\n            \u003cdiv class=\"text-xs font-black text-slate-800\">${escHtml(c.author)}\u003c/div>\r\n            \u003cdiv class=\"flex items-center gap-2\">${statusBadge(c)}${commentMod(c)}\u003c/div>\r\n          \u003c/div>\r\n          \u003cdiv class=\"text-sm text-slate-700 mt-1\">${escHtml(c.body)}\u003c/div>\u003c/div>\r\n          ${replies}\r\n        \u003c/div>`;\r\n      }).join(\"\") || '\u003cp class=\"field-help\">还没有评论\u003c/p>';\r\n      document.getElementById(\"postDrawerBody\").innerHTML = `\r\n        \u003cdiv class=\"rounded-2xl border border-slate-100 bg-slate-50 p-4\">\r\n          \u003cdiv class=\"text-xs font-black text-slate-500\">${escHtml(post.author)} · ${escHtml(post.country)}\u003c/div>\r\n          \u003ch3 class=\"text-lg font-black text-slate-900 mt-2\">${escHtml(post.title)}\u003c/h3>\r\n          \u003cdiv class=\"mt-2 text-xs font-black text-indigo-600\">${post.tags.map((tag) => \"#\" + escHtml(tag)).join(\" \")}\u003c/div>\r\n          \u003cp class=\"text-sm text-slate-700 mt-3 whitespace-pre-wrap\">${escHtml(post.body)}\u003c/p>\r\n          \u003cdiv class=\"mt-3 text-sm font-black text-slate-700\">♥ ${post.likes} · 评论 ${post.comments}\u003c/div>\r\n          \u003cdiv class=\"mt-2\">${statusBadge(post)}\u003c/div>\r\n        \u003c/div>\r\n        \u003cdiv class=\"text-xs font-black text-slate-400\">评论\u003c/div>\r\n        ${thread}`;\r\n      document.getElementById(\"postDrawerFoot\").innerHTML = `\u003cdiv class=\"mr-auto flex gap-3 items-center\">${postOps(post)}\u003c/div>\u003cbutton type=\"button\" data-close-post class=\"btn-secondary\">关闭\u003c/button>`;\r\n      document.querySelectorAll('#postDrawerFoot [data-open-post],#postDrawerFoot [data-review-id]').forEach(button=>button.remove());\n      openDrawer(\"postDrawer\");\r\n    }\r\n    function askConfirm(title, sub, okText, action) {\r\n      document.getElementById(\"confirmTitle\").textContent = title;\r\n      document.getElementById(\"confirmSub\").textContent = sub;\r\n      document.getElementById(\"btnConfirmOk\").textContent = okText;\r\n      pendingAction = action;\r\n      openModal(\"shellModal\");\r\n    }\r\n    function applyContentAction(e) {\r\n      const openBtn = e.target.closest(\"[data-open-post]\");\r\n      const pick = e.target.closest(\"[data-pick]\");\r\n      const unpick = e.target.closest(\"[data-unpick]\");\r\n      const offBtn = e.target.closest(\"[data-off-post]\");\r\n      const onBtn = e.target.closest(\"[data-on-post]\");\r\n      const offComment = e.target.closest(\"[data-off-comment]\");\r\n      const onComment = e.target.closest(\"[data-on-comment]\");\r\n      if (openBtn) renderPostDrawer(openBtn.dataset.openPost);\r\n      if (pick) {\r\n        const row = posts.find((item) => item.id === pick.dataset.pick);\r\n        if (row) { row.featured = true; row.featuredAt = Date.now(); }\r\n        showToast(\"已标为精选，从下一批未生成的批次起进入精选帖\");\r\n        renderPosts();\r\n      }\r\n      if (unpick) {\r\n        const row = posts.find((item) => item.id === unpick.dataset.unpick);\r\n        if (row) row.featured = false;\r\n        showToast(\"已取消精选，帖子回到导购帖\");\r\n        renderPosts();\r\n      }\r\n      if (offBtn) askConfirm(\"下架这条帖子？\", \"从内容流和话题页消失。作者看到已下架，不显示原因。精选会清除。\", \"确认下架\", () => {\r\n        const row = posts.find((item) => item.id === offBtn.dataset.offPost);\r\n        if (row) { row.status = \"已下架\"; row.featured = false; }\r\n        showToast(\"已下架\");\r\n      });\r\n      if (onBtn) {\r\n        const row = posts.find((item) => item.id === onBtn.dataset.onPost);\r\n        if (row) row.status = \"已发布\";\r\n        showToast(\"已恢复。精选状态不恢复\");\r\n        renderPosts();\r\n      }\r\n      if (offComment) askConfirm(\"下架这条评论？\", \"这条评论和它的回复一并隐藏。\", \"确认下架\", () => {\r\n        const row = comments.find((item) => item.id === offComment.dataset.offComment);\r\n        if (row) row.status = \"已下架\";\r\n        showToast(\"评论已下架\");\r\n      });\r\n      if (onComment) {\r\n        const row = comments.find((item) => item.id === onComment.dataset.onComment);\r\n        if (row) row.status = \"已发布\";\r\n        showToast(\"评论已恢复\");\r\n        renderPosts();\r\n      }\r\n    }\r\n\r\n    document.getElementById(\"crumb\").addEventListener(\"click\", () => showView(\"topics\"));\r\n    document.getElementById(\"btnNew\").addEventListener(\"click\", () => {\r\n      editingTopicId = null;\r\n      document.getElementById(\"drawerTitle\").textContent = \"新建话题\";\r\n      document.getElementById(\"actTitle\").value = \"\";\r\n      document.getElementById(\"actBody\").value = \"\";\r\n      document.getElementById(\"topicPin\").classList.remove(\"active\");\r\n      document.getElementById(\"topicPin\").setAttribute(\"aria-checked\", \"false\");\r\n      document.querySelectorAll(\"#topicScope .cycle-chip\").forEach((el) => el.classList.toggle(\"active\", el.dataset.scope === \"PH\"));\r\n      document.getElementById(\"scopeGlobal\").disabled = role === \"country\";\r\n      document.getElementById(\"scopeGlobal\").classList.toggle(\"opacity-40\", role === \"country\");\r\n      openDrawer(\"shellDrawer\");\r\n    });\r\n    document.querySelectorAll(\".nav-sub\").forEach((btn) => btn.addEventListener(\"click\", () => {\r\n      if (btn.dataset.view === \"rules\" && role === \"country\") return;\r\n      showView(btn.dataset.view);\r\n    }));\r\n    document.getElementById(\"roleSwitch\").addEventListener(\"click\", (e) => {\r\n      const btn = e.target.closest(\"[data-role]\");\r\n      if (!btn) return; r');previous.trigger.focus({preventScroll:true});\r\n  }\r\n};\r\ndocument.addEventListener('click',async event=>{\r\n  const trigger=event.target.closest('[data-review-pool],[data-review-id]');if(!trigger||entry)return;\r\n  const id=trigger.dataset.reviewId;\r\n  entry={id,scroll:postBody.scrollTop,trigger};\r\n  await reviewReady;if(!entry)return;\r\n  panel.classList.add('reviewing');openDrawer('postDrawer');\r\n  reviewFrame.contentWindow.start(id);\r\n});\r\npostShell.addEventListener('click',event=>{\r\n  if(entry && event.target.matches('.drawer-backdrop')){\r\n    event.stopImmediatePropagation();closeReviews();\r\n  }\r\n},true);\r\ndocument.addEventListener('keydown',event=>{\r\n  if(entry && event.key==='Escape'){event.preventDefault();closeReviews()}\r\n});\r\n\u003c/script>\r\n\r\n\u003cstyle>\r\n#reviewPage{max-width:1100px;margin:auto;padding:20px}\r\n.review-tabs{display:flex;gap:10px;margin:18px 0}.review-tabs button{padding:8px 14px;border:1px solid #dce3f0;border-radius:8px;background:white}.review-tabs button.on{background:#eef2ff;color:#4f46e5}\r\n.review-box{margin:12px 0;padding:16px;background:#f7f8ff;border:1px solid #dfe3fa;border-radius:12px;font-size:13px}.review-box h4{font-weight:800;margin:0 0 10px}.review-box p{margin:7px 0;line-height:1.6}.review-box textarea{display:block;width:100%;min-height:75px;border:1px solid #cbd5e1;border-radius:8px;padding:10px;margin:8px 0;background:white}.review-box .rv-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.review-box .rv-actions button{padding:8px 12px;border:1px solid #ccd4ea;border-radius:7px;background:#fff}.review-box .rv-actions button:first-child{background:#636ae8;color:white;border-color:#636ae8}\r\n.review-target{background:#f8f9ff;border:1px solid #d6dcf0;border-radius:14px;padding:16px}.review-target .inline-review{border-top:1px solid #dce2f2;margin:15px -16px -16px;padding:16px;border-radius:0 0 14px 14px;background:#fff}.review-target .ai-judgment{background:#f7f8ff dgment{background:transparent;border:0;border-radius:0;padding:0}\r\n.review-target .ai-judgment h4,.review-target .review-advice label,.review-target .result-heading h4{font-size:14px;font-weight:800;color:#39445a}\r\n.review-target .review-advice,.review-target .review-result-card{border:0;border-top:1px solid #dce2ee;border-radius:0;background:transparent;padding:18px 0 0;margin:18px 0 0}\r\n.review-target .review-advice textarea{margin-top:9px;background:white}\r\n.review-target .result-footer{border-color:#dce2ee}\r\n\r\n.workbench-intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.workbench-intro h2{font-size:22px;font-weight:800;color:#16223b}.workbench-intro p{margin-top:5px;font-size:12px;color:#7d899d}.pending-count{display:flex;align-items:baseline;gap:7px;background:#eef2ff;color:#5558d0;padding:10px 16px;border-radius:12px;font-size:12px}.pending-count b{font-size:23px}.workbench-panel{background:white;border:1px solid #e5eaf2;border-radius:16px;overflow:hidden}.type-tabs{display:flex;gap:24px;padding:0 20px;border-bottom:1px solid #edf1f6}.type-tabs button{position:relative;padding:16px 2px;color:#758198;font-size:13px;font-weight:700}.type-tabs button.on{color:#585ce1}.type-tabs button.on:after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:#636ae8;border-radius:3px}.type-tabs span{margin-left:4px;font-size:11px}.workbench-panel .pool-controls{padding:18px 20px 0}.workbench-table{min-width:950px}.workbench-table td:first-child{min-width:210px;max-width:300px}.workbench-context{margin-top:5px;color:#94a3b8;font-size:11px}.wb-lean,.wb-state{display:inline-block;white-space:nowrap;border-radius:6px;padding:3px 7px;font-size:11px}.wb-lean{background:#e9f8f1;color:#168455}.wb-lean.stop{background:#fef0ef;color:#c0524c}.wb-state{background:#f1f5f9;color:#64748b}.wb-state.wait{background:#fff4dd;color:#a46818}.workbench-empty{padding:35px;text-align:center;color:#94a3b8;font-size:13px}.workbench-footer{padding:14px 20px;color:#94a3b8;font-size:12px}.workbench-panel .page-table-wrap{overflow:auto}\r\n.type-tabs{align-items:center}.workbench-review-count{margin-left:auto;color:#636ae8;background:#eef2ff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}#reviewPage{padding-top:8px}\r\n.source-icon{color:#8994ac;font-size:13px;margin-right:3px}\r\n\u003c/style>\r\n\u003cscript>\r\nconst reviewPage=document.createElement('div');\r\nreviewPage.id='reviewPage';reviewPage.className='hidden';\r\ndocument.getElementById('viewPosts').parentElement.appendChild(reviewPage);\r\nlet reviewTab='wait',inlineReview=null,fromQueue=false;\r\nposts.unshift(demoPost);\r\nconst originalShowView=showView;\r\nshowView=function(name){fromQueue=false;inlineReview=null;reviewPage.classList.add('hidden');originalShowView(name)};\r\nconst originalPostOps=postOps;\r\npostOps=function(item){\r\n if(item.id==='rv-post' && item.status==='待复核')return '\u003cbutton class=\"rv-link\" data-open-post=\"rv-post\">查看\u003c/button> \u003cbutton class=\"rv-link\" data-review-id=\"rv-post\">去复核\u003c/button>';\r\n \r\n return originalPostOps(item);\r\n};\r\n\r\nfunction showPool(){\r\n fromQueue=true;inlineReview=null;originalShowView('posts');\r\n document.getElementById('viewPosts').classList.add('hidden');\r\n reviewPage.classList.remove('hidden');\r\n document.getElementById('pageTitle').textContent='社区内容管理工作台';\r\n document.getElementById('pageSub').textContent='浏览社区内容，处理上架、下架、置顶和精选事项';\r\n renderPool();\r\n}\r\n\r\n\r\n\r\nlet poolSearch='',poolTopic='all',poolCountry='all',poolType='帖子',poolStatus='all',activeManagementTask=null;\r\nlet poolSortKey='',poolSortDirection='';\nfunction workbenchMetric(row,key){\n if(key==='comments'&&row.type!=='帖子')return -1;\n const number=Number(row.content[key]);return Number.isFinite(number)?Math.max(0,number):0;\n}\nfunction sortWorkbenchRows(rows){\n if(!poolSortKey||poolType==='评论')return rows;\n return rows.map((row,index)=>({row,index})).sort((a,b)=>{\n  const diff=workbenchMetric(a.row,poolSortKey)-workbenchMetric(b.row,poolSortKey);\n  return (poolSortDirection==='desc'?-diff:diff)||a.index-b.index;\n }).map(item=>item.row);\n}\nfunction workbenchMetricHeader(key,label){\n const active=poolType!=='评论'&&poolSortKey===key;\n const order=active?(poolSortDirection==='desc'?'descending':'ascending'):'none';\n return '\u003cth class=\"workbench-metric\" aria-sort=\"'+order+'\">\u003cbutton type=\"button\" data-pool-sort=\"'+key+'\" aria-label=\"按'+label+'排序，'+(active?(poolSortDirection==='desc'?'当前从高到低':'当前从低到高'):'当前未排序')+'\">'+label+' \u003cspan aria-hidden=\"true\">'+(active?(poolSortDirection==='desc'?'↓':'↑'):'↕')+'\u003c/span>\u003c/button>\u003c/th>';\n}\nconst managementTasks=[];\r\nfunction finishManagement(){}\r\nfunction filteredWorkbenchRows(){\r\n const permitted=visiblePosts().filter(p=>p.status!=='已删除').map(p=>({type:'帖子',content:p,post:p,review:reviewRows().find(t=>t.id===p.id)}));\r\n const reviewComments=visibleComments().map(c=>({type:'评论',content:c,post:visiblePosts().find(p=>p.id===c.postId),review:reviewRows().find(t=>t.id===c.id)})).filter(x=>x.post);\r\n const all=[...permitted,...reviewComments];\r\n const q=poolSearch.trim().toLowerCase();\r\n return all.filter(({type,content,post})=>(poolType==='all'||poolType===type)&&(poolStatus==='all'||(poolStatus==='已精选'?type==='帖子'&&content.status==='已发布'&&content.featured:poolStatus==='已发布'?content.status==='已发布'&&!content.featured:content.status===poolStatus))&&(poolCountry==='all'||content.country===poolCountry)&&(poolTopic==='all'||post.tags.includes(poolTopic))&&(!q||[content.title,content.body,content.author,post.title].some(v=>String(v||'').toLowerCase().includes(q))));\r\n}\r\nfunction workbenchRowActions(type,content,post,viewAction){\n const button=(attribute,label)=>'\u003cbutton type=\"button\" class=\"rv-link\" '+attribute+'=\"'+escHtml(content.id)+'\">'+label+'\u003c/button>';\n let html='\u003cbutton type=\"button\" class=\"rv-link\" '+viewAction+'>查看\u003c/button>';\n if(!canOperatePost(content))return '\u003cdiv class=\"workbench-row-actions\">'+html+'\u003c/div>';\n if(content.status==='已发布'){\n  if(type==='帖子'){\n   html+=button(content.featured?'data-unpick':'data-pick',content.featured?'取消精选':'精选');\n  }\n  html+=button(type==='帖子'?'data-off-post':'data-off-comment','下架');\n }else if(content.status==='已下架')html+=button(type==='帖子'?'data-on-post':'data-on-comment','恢复');\n return '\u003cdiv class=\"workbench-row-actions\">'+html+'\u003c/div>';\n}\nfunction renderPool(preserveControls=false){\r\n const rows=sortWorkbenchRows(filteredWorkbenchRows());\r\n const options=(items,current)=>items.map(([value,label])=>'\u003coption value=\"'+escHtml(value)+'\" '+(value===current?'selected':'')+'>'+escHtml(label)+'\u003c/option>').join('');\r\n const topics=[...new Set(visiblePosts().flatMap(p=>p.tags))];\r\n const markup='\u003cdiv class=\"workbench-panel\">\u003cdiv class=\"type-tabs\">'+[['all','全部'],['帖子','帖子'],['评论','评论']].map(([v,label])=>'\u003cbutton type=\"button\" class=\"'+(poolType===v?'on':'')+'\" data-type-tab=\"'+v+'\">'+label+'\u003c/button>').join('')+'\u003c/div>\u003cdiv class=\"pool-controls\">\u003cinput class=\"form-input\" id=\"poolSearch\" placeholder=\"搜索内容、帖子或作者\" value=\"'+escHtml(poolSearch)+'\">\u003cselect class=\"form-input\" id=\"poolStatus\">'+options([['all','全部状态'],['待复核','待复核'],['已发布','已发布'],['已精选','已精选'],['已下架','已下架']],poolStatus)+'\u003c/select>\u003cselect class=\"form-input\" id=\"poolTopic\">'+options([['all','全部话题'],...topics.map(t=>[t,t])],poolTopic)+'\u003c/select>'+(role==='hq'?'\u003cselect class=\"form-input\" id=\"poolCountry\">'+options([['all','全部国家'],['菲律宾','菲律宾'],['尼日利亚','尼日利亚']],poolCountry)+'\u003c/select>':'')+'\u003c/div>\u003cdiv class=\"page-table-wrap\">\u003ctable class=\"content-table workbench-table\">\u003cthead>\u003ctr>\u003cth>内容\u003c/th>'+(poolType==='all'?'\u003cth>类型\u003c/th>':'')+'\u003cth>话题\u003c/th>\u003cth>作者\u003c/th>\u003cth>国家\u003c/th>'+(poolType==='评论'?'\u003cth class=\"workbench-metric\">赞数\u003c/th>':workbenchMetricHeader('likes','赞数')+workbenchMetricHeader('comments','评论数'))+'\u003cth>状态\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+rows.map(({type,content,post,review})=>{\r\n const detail=type==='评论'?'\u003cdiv class=\"workbench-context\">\u003cspan class=\"source-icon\" aria-label=\"帖子\">▤\u003c/span> '+escHtml(post.title)+'\u003c/div>':'\u003cdiv class=\"workbench-context\">'+escHtml(content.body)+'\u003c/div>';\r\n const action=review?'data-pool-item=\"'+review.id+'\"':type==='评论'?'data-pool-comment=\"'+content.id+'\"':'data-pool-post=\"'+post.id+'\"';\r\n const n=type==='帖子'?reviewRows().filter(t=>t.postId===post.id&&t.status==='待处理').length:0;\r\n const reviewLabel=n?'\u003cbutton class=\"rv-count\" data-review-comments=\"'+post.id+'\">'+n+' 条评论待复核\u003c/button>':'';\r\n return '\u003ctr>\u003ctd>\u003cb>'+escHtml(type==='帖子'?content.title:content.body)+'\u003c/b>'+reviewLabel+detail+'\u003c/td>'+(poolType==='all'?'\u003ctd>'+type+'\u003c/td>':'')+'\u003ctd>'+post.tags.map(t=>'#'+escHtml(t)).join(' ')+'\u003c/td>\u003ctd>'+escHtml(content.author)+'\u003c/td>\u003ctd>'+escHtml(content.country)+'\u003c/td>\u003ctd class=\"workbench-metric\">'+workbenchMetric({type,content},'likes')+'\u003c/td>'+(poolType==='评论'?'':'\u003ctd class=\"workbench-metric\">'+(type==='帖子'?workbenchMetric({type,content},'comments'):'—')+'\u003c/td>')+'\u003ctd>'+statusBadge(content)+'\u003c/td>\u003ctd class=\"workbench-actions-cell\">'+workbenchRowActions(type,content,post,action)+'\u003c/td>\u003c/tr>';\r\n }).join('')+'\u003c/tbody>\u003c/table>'+(rows.length?'':'\u003cp class=\"workbench-empty\">当前条件下没有内容\u003c/p>')+'\u003c/div>\u003cdiv class=\"workbench-footer\">共 '+rows.length+' 条\u003c/div>\u003c/div>';\r\n if(preserveControls){\n  const fragment=document.createElement('div');fragment.innerHTML=markup;\n  for(const selector of ['.page-table-wrap','.workbench-footer']){\n   reviewPage.querySelector(selector).replaceWith(fragment.querySelector(selector));\n  }\n }else reviewPage.innerHTML=markup;\n}\n\nreviewPage.addEventListener('click',e=>{\n const button=e.target.closest('[data-pool-sort]');if(!button||poolType==='评论')return;\n const key=button.dataset.poolSort;\n if(!['likes','comments'].includes(key))return;\n if(poolSortKey!==key){poolSortKey=key;poolSortDirection='desc';}\n else if(poolSortDirection==='desc')poolSortDirection='asc';\n else{poolSortKey='';poolSortDirection='';}\n renderPool(true);\n reviewPage.querySelector('[data-pool-sort=\"'+key+'\"]')?.focus({preventScroll:true});\n});\n\nreviewPage.addEventListener('click',e=>{\n const action=e.target.closest('[data-pick],[data-unpick],[data-off-post],[data-on-post],[data-off-comment],[data-on-comment]');\n if(!action)return;\n applyContentAction(e);\n if(!action.matches('[data-off-post],[data-off-comment]'))renderPool(true);\n});\n\nlet poolSearchComposing=false;\nfunction updateWorkbenchSearch(input){\n poolSearch=input.value;renderPool(true);\n}\nreviewPage.addEventListener('compositionstart',e=>{if(e.target.id==='poolSearch')poolSearchComposing=true});\nreviewPage.addEventListener('compositionend',e=>{\n if(e.target.id!=='poolSearch')return;\n poolSearchComposing=false;updateWorkbenchSearch(e.target);\n});\nreviewPage.addEventListener('input',e=>{\n if(e.target.id!=='poolSearch'||poolSearchComposing||e.isComposing)return;\n updateWorkbenchSearch(e.target);\n});\nreviewPage.addEventListener('change',e=>{if(e.target.id==='poolTopic')poolTopic=e.target.value;else if(e.target.id==='poolCountry')poolCountry=e.target.value;else if(e.target.id==='poolStatus')poolStatus=e.target.value;else return;renderPool()});\r\nconst originalDrawer=renderPostDrawer;\r\nrenderPostDrawer=function(id){\r\n originalDrawer(id);\r\n const post=posts.find(p=>p.id===id);\r\n if(post.id==='rv-post'){\r\n  const card=document.querySelector('#postDrawerBody > div');\r\n  card.lastElementChild.insertAdjacentHTML('beforeend',' \u003cbutton type=\"button\" class=\"rv-link\" data-review-id=\"rv-post\" aria-expanded=\"false\">'+(reviewRecords.find(t=>t.id==='rv-post').status==='待处理'?'去复核':'查看复核结果')+'\u003c/button>');\r\n }\r\n if(activeManagementTask){\r\n  const task=managementTasks.find(t=>t.id===activeManagementTask);\r\n  if(task && task.postId===id){\r\n   document.getElementById('postDrawerSub').textContent=task.status==='待处理'?'运营事项 · '+task.suggestion:'运营事项 · '+task.completedAction;\r\n   if(task.status==='待处理')document.querySelector('#postDrawerFoot .mr-auto').insertAdjacentHTML('beforeend',' \u003cbutton class=\"rv-link\" data-wb-done>标记已处理\u003c/button>');\r\n  }\r\n }\r\n if(post.status==='已发布'){\r\n  const holder=document.querySelector('#postDrawerFoot .mr-auto');\r\n\r\n }\r\n if(inlineReview)paintReview(inlineReview,false);\r\n};\r\nfunction showReviewOriginal(){\r\n const scroller=document.getElementById('postDrawerBody');\r\n const target=scroller.querySelector('.review-target');\r\n if(!target)return;\r\n const top=target.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop;\r\n scroller.scrollTo({top:Math.max(0,top-12),behavior:'auto'});\r\n}\r\nfunction updateReviewToggles(activeId=null){\n document.querySelectorAll('#postDrawerBody button[data-review-id]').forEach(button=>{\n  const record=reviewRows().find(row=>row.id===button.dataset.reviewId);\n  const expanded=button.dataset.reviewId===activeId;\n  const inCard=Boolean(button.closest('.review-card'));\n  button.hidden=!inCard&&expanded;\n  button.textContent=inCard?'收起':(record?.status==='已处理'?'查看复核结果':'去复核');\n  button.setAttribute('aria-expanded',String(expanded));\n });\n document.querySelectorAll('#postDrawerBody .review-card').forEach(card=>{card.hidden=card.dataset.reviewCardId!==activeId});\n}\nfunction paintReview(id,scroll=true){\r\n const t=reviewRows().find(x=>x.id===id);if(!t)return;\r\n inlineReview=id;\n const retained=Array.from(document.querySelectorAll('.inline-review')).find(box=>box.dataset.inlineReviewId===id);\n if(retained?.hidden && retained.dataset.inlineReviewId===id){\n  retained.hidden=false;retained.parentElement.classList.add('review-target');\n  updateReviewToggles(id);if(scroll)showReviewOriginal();return;\n }\n document.querySelectorAll('.review-card').forEach(x=>x.remove());\r\n document.querySelectorAll('.review-target').forEach(x=>x.classList.remove('review-target'));\r\n updateReviewToggles(id);\r\n const button=document.querySelector('#postDrawerBody [data-review-id=\"'+id+'\"]');\r\n if(!button)return;\r\n const host=id==='rv-post'?button.closest('#postDrawerBody > div'):button.closest('.comment-content, .ml-10');\n const container=document.createElement('section');container.className='review-card';container.dataset.reviewCardId=id;container.setAttribute('aria-label','人工复核');\n container.innerHTML='\u003cheader class=\"review-card-header\">\u003ch3>人工复核\u003c/h3>\u003cbutton type=\"button\" class=\"rv-link\" data-review-id=\"'+escHtml(id)+'\" aria-expanded=\"true\">收起\u003c/button>\u003c/header>';\n if(id==='rv-post')host.after(container);else host.appendChild(container);\n container.classList.add('review-target');\r\n\r\n const box=document.createElement('div');box.className='review-box inline-review';box.dataset.inlineReviewId=id;\r\n const uncertain=t.ai_review_leaning==='uncertain',reverse=t.lean==='拦截'?'放行':'拦截';\r\n let html='\u003cdiv class=\"ai-judgment\">\u003cdiv class=\"review-ai-heading\">\u003ch4>安小检的判断\u003c/h4>\u003cspan class=\"ai-lean '+(t.lean==='拦截'?'stop':'')+'\">倾向'+escHtml(t.lean)+'\u003c/span>\u003c/div>\u003cdiv class=\"review-reason\">\u003cdiv class=\"review-field-label\">判断依据\u003c/div>\u003cp>'+escHtml(t.why)+'\u003c/p>\u003c/div>\u003cdiv class=\"review-rule-row\">\u003cspan class=\"review-field-label\">命中规则\u003c/span>\u003cspan class=\"review-rule-value\">'+escHtml(t.rule||'无')+'\u003c/span>\u003c/div>\u003c/div> function anDayOffset(day,offset){
  return new Date(Date.parse(day+'T00:00:00Z')+offset*86400000).toISOString().slice(0,10);
}

function initializeAnRecords(){
  const offsets={q1:0,q2:0,q3:0,q4:0,q5:1,q6:1,q7:2,q8:3,q9:1,q10:0,q11:0,q12:0,q13:3,q14:4,q15:4,q16:5,q17:6};
  const reasons={
    q3:'内容描述门店活动，但涉及宗教节日与促销结合，建议由当地人员核实表达边界。',
    q4:'表达接近日常议价，但包含价差保证和退差承诺，需要人工确认门店是否有对应政策。',
    q5:'内容用于讲解屏幕卖点，但防近视等表述需要核查产品依据。',
    q8:'作者提到个人续航体验，但三天续航及比较结论需要结合使用条件核实。',
    q9:'内容是节日期间的促销活动，涉及当地宗教语境，需要人工确认是否适宜。',
    q14:'帖子讲解屏幕卖点，但看多久都不伤眼是绝对化健康表述，需要核查依据。'
  };
  QUEUE.forEach(item=>{
    const day=anDayOffset(AN_TODAY,-offsets[item.id]);
    const clock=item.time.split(' ')[1]||'10:00';
    item.audit_at=day+' '+clock;
    item.time=day.slice(5)+' '+clock;
    item.ai_decision=item.status==='待处理'||item.manual_result?'review':(item.lean==='放行'?'allow':'reject');
    item.ai_review_leaning=item.ai_decision==='review'?(item.review_leaning||(item.lean==='放行'?'allow':'reject')):null;
    if(reasons[item.id]) item.why=reasons[item.id];
    if(item.handledAt) item.handledAt=day.slice(5)+' '+(item.handledAt.split(' ')[1]||clock);
    if(item.type==='评论') item.title=null;
  });
  [...KB.good,...KB.bad].forEach((item,index)=>{
    item.case_id='legacy_case_'+index;
    if(item.kind==='评论')item.t=null;
  });
  expandAnDemoRecords();
  initializeAnContext();
  QUEUE.forEach(upsertKnowledgeCase);
  initializeLearningRuns();
  syncAnLearningRecords();
  syncAnSummary();
}

function anRowsBetween(from,to,market="全部"){
  return QUEUE.filter(item=>(market==="全部"||item.country===market)&&item.audit_at.slice(0,10)>=from&&item.audit_at.slice(0,10)<=to);
}

function anSummary(items){
  const reviewed=items.filter(item=>item.manual_result&&['allow','reject'].includes(item.ai_review_leaning));
  const adopted=reviewed.filter(item=>item.manual_result.action==='采纳').length;
  return {
    total:items.length,
    autoAllow:items.filter(item=>item.ai_decision==='allow').length,
    autoReject:items.filter(item=>item.ai_decision==='reject').length,
    pool:items.filter(item=>item.ai_decision==='review').length,
    reviewed:reviewed.length,adopted,
    changed:reviewed.length-adopted,
    rate:reviewed.length?Math.round(adopted/reviewed.length*1000)/10:null
  };
}

function anDailyRows(days){
  return Array.from({length:days},(_,index)=>{
    const date=anDayOffset(AN_TODAY,-index);
    return {date,...anSummary(anRowsBetween(date,date))};
  });
}

function syncAnSummary(){
  const employee=EMPLOYEES.find(item=>item.id==='an');
  const recent=anSummary(QUEUE.filter(item=>item.audit_at.slice(0,10)>=anDayOffset(AN_TODAY,-6)&&item.audit_at.slice(0,10)<=AN_TODAY));
  employee.work.rows=Array.from({length:7},(_,index)=>{
    const date=anDayOffset(AN_TODAY,-index);
    return {date,...anSummary(QUEUE.filter(item=>item.audit_at.startsWith(date)))};
  }).map(row=>({
    date:row.date,w:row.date===AN_TODAY?'今天':'',handled:row.total,
    auto:row.autoAllow+row.autoReject,pool:row.pool,adopted:row.adopted,
    st:row.rate===null?'—':row.rate>=employee.metric.target_v?'正常':'低于目标'
  }));
  employee.metric.value=recent.rate===null?'—':String(recent.rate);
  employee.metric.noteLevel=recent.rate!==null&&recent.rate>=employee.metric.target_v?'good':'warn';
  employee.metric.formula='人工采纳数 ÷（人工采纳数＋人工改判数）× 100%';
  employee.metric.plain='统计已完成的人工复核：采纳 AI 判断计入采纳数，改判计入改判数；待处理记录不参与计算。';
  employee.metric.note='近 7 天人工采纳 '+recent.adopted+' 条，人工改判 '+recent.changed+' 条。';
  employee.scope=[...new Set(QUEUE.map(item=>item.country))].map(marketName).join(' / ');
}

function anLogItems(){

  return anRowsBetween(anLogState.from,anLogState.to,anMarket)
    .filter(item=>(anLogState.type==='全部'||item.type===anLogState.type)&&
      (!query||[item.title,item.body,item.author].some(value=>String(value||'').toLocaleLowerCase().includes(query))))

}

  $('#anTabAnalysis').onclick=showAnalysis;

function switchAnTab(tab){
  const view=tab==='analysis'?'an-analysis':'emp';
  if(route.v===view&&route.id==='an'&&(view==='an-analysis'||(route.tab||'role')===tab)) return;
  route={v:view,id:'an',tab};
  render();
}

function renderAnWorkspace(active,content){
  const main=$('.main');
  const scrollTop=main?.scrollTop||0;
  const sameWorkspace=Boolean($('#anWorkspaceHeader')&&$('#anWorkspaceContent'));
  if(sameWorkspace){
    $('#anWorkspaceContent').innerHTML=content;
    const today=anSummary(anRowsBetween(AN_TODAY,AN_TODAY));
    const recent=anSummary(anRowsBetween(anDayOffset(AN_TODAY,-6),AN_TODAY));
    const pending=QUEUE.filter(item=>item.ai_decision==='review'&&item.status==='待处理').length;
    $('#anToday strong').innerHTML=`${today.total}<small> 条</small>`;
    $('#anPending strong').innerHTML=`${pending}<small> 条</small>`;
    $('#anPerformance strong').textContent=recent.rate===null?'—':recent.rate+'%';

    for(const [id,tab] of [['anTabRole','role'],['anTabAnalysis','analysis'],['anTabWork','work']]){
      $('#'+id).classList.toggle('on',active===tab);
      $('#'+id).setAttribute('aria-current',active===tab?'page':'false');
    }
  } else {
    $('#wrap').innerHTML=`<div id="anWorkspaceHeader">${renderAnHeader(active)}</div><div id="anWorkspaceContent">${content}</div>`;
  }
  bindAnHeader();

}

function renderAnGrowthTabs(){
  const active=route.log==='learning'?'learning':'work';
  return `<nav class="an-growth-tabs" role="tablist" aria-label="成长日志分类">${[['work','工作日志'],['learning','学习日志']].map(([key,label])=>`<button id="anLog-${key}" role="tab" aria-selected="${active===key}" aria-controls="anGrowthPanel" tabindex="${active===key?'0':'-1'}" data-an-log="${key}" class="${active===key?'on':''}">${label}</button>`).join('')}</nav>`;
}

function bindAnGrowthTabs(){
  const select=key=>{
    route={v:'emp',id:'an',tab:'work',log:key};
    renderAnHome();
    $('#anLog-'+key)?.focus();
  };
  $$('[data-an-log]').forEach(button=>{
    button.onclick=()=>select(button.dataset.anLog);
    button.onkeydown=event=>{
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
      event.preventDefault();
      select(event.key==='Home'?'work':event.key==='End'?'learning':button.dataset.anLog==='work'?'learning':'work');
    };
  });
}
