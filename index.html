<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIbuddy · 安小检自主学习 V2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235B5BFF'/><text x='50' y='68' font-size='54' fill='white' text-anchor='middle' font-family='sans-serif'>A</text></svg>">
<style>
:root{
  --bg:#F7F7FB; --panel:#FFFFFF;
  --ink:#1E2038; --ink2:#3C3F5A; --muted:#787C94; --muted2:#9CA0B4;
  --line:#EEEEF6; --line2:#F4F4FA;
  --accent:#5B5BFF; --accent-ink:#4A4ADE; --lav:#EEEEFB; --lav2:#F6F6FE;
  --ok:#1B9A6A; --ok-bg:#E9F8F1;
  --warn:#B4781A; --warn-bg:#FFF3E3;
  --bad:#C4453F; --bad-bg:#FDEDEC;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
 font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
.ic{width:17px;height:17px;fill:currentColor;flex:none;opacity:.9}

/* 顶栏 */
.top{height:56px;display:flex;align-items:center;gap:10px;padding:0 26px;
 background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-size:19px;font-weight:800;letter-spacing:.01em}
.logosub{font-size:16px;font-weight:600;color:var(--ink2)}
.ver{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--lav);
 border-radius:6px;padding:3px 7px;position:relative;top:-1px}
.top .sp{margin-left:auto}
.top .who{font-size:12px;color:var(--muted2)}
.tabs{height:46px;display:flex;align-items:center;gap:32px;padding:0 26px;
 background:var(--panel);border-bottom:1px solid var(--line)}
.tabs .t{position:relative;height:46px;display:flex;align-items:center;font-size:14px;
 color:var(--muted);font-weight:500}
.tabs .t.on{color:var(--ink);font-weight:700}
.tabs .t.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
 background:var(--accent);border-radius:2px 2px 0 0}

/* 侧栏 */
.workspace{display:grid;grid-template-columns:224px minmax(0,1fr);height:calc(100vh - 102px);min-height:0;overflow:hidden}
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px 14px;
 display:flex;flex-direction:column}
.side .id{display:flex;gap:10px;align-items:center;padding:0 8px 20px}
.side .id .sq{width:40px;height:40px;border-radius:12px;background:var(--lav);
 color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px}
.side .id b{display:block;font-size:15px}
.side .id span{display:block;font-size:12px;color:var(--muted2);margin-top:2px}
.navroot{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;
 font-size:13.5px;font-weight:600;color:var(--ink2);width:100%;text-align:left}
.navroot:hover{background:var(--lav2)}
.navroot .ic{color:var(--muted)}
.navroot .n{margin-left:auto;font-size:11px;color:var(--muted2)}
.navsub{list-style:none;margin:2px 0 10px}
.navsub li{padding-left:32px}
.navsub a{display:block;padding:8px 12px;border-radius:10px;font-size:13px;color:var(--muted)}
.navsub a:hover{background:var(--lav2);color:var(--ink2)}
.navsub a.on{background:var(--lav);color:var(--accent-ink);font-weight:700}
.userbox{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 2px;display:flex;gap:9px}
.userbox .av{width:34px;height:34px;border-radius:50%;background:var(--lav);color:var(--accent-ink);
 display:grid;place-items:center;font-weight:800}
.userbox b{font-size:13px}
.tg{display:flex;gap:5px;margin-top:5px}
.tg span{font-size:10px;font-weight:700;border-radius:4px;padding:2px 5px}
.tg span.a{background:var(--accent);color:#fff}
.tg span.b{background:var(--lav);color:var(--accent-ink)}

/* 画布 */
.main{padding:26px 30px 44px;overflow:auto;min-width:0;min-height:0;scrollbar-gutter:stable;overflow-anchor:none}
.side{min-height:0;overflow-y:auto}
.wrap{max-width:1520px;margin:0 auto}
.h1{font-size:24px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.desc{font-size:13px;color:var(--muted);margin-top:8px;max-width:820px;line-height:1.75}
.head{display:flex;align-items:flex-start;gap:20px}
.head .act{margin-left:auto;display:flex;gap:9px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
 border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;color:var(--ink2);transition:.16s}
.btn .ic{width:15px;height:15px}
.btn:hover{border-color:#DEDEF2;box-shadow:0 2px 10px rgba(30,32,56,.06)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;
 box-shadow:0 6px 18px rgba(91,91,255,.26)}
.btn.primary:hover{background:#5050F2}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}

/* 概览条 */
.strip{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
 margin:22px 0 20px;padding:15px 6px}
.strip .c{flex:1;padding:0 20px;border-right:1px solid var(--line2)}
.strip .c:last-child{border-right:0}
.strip .k{font-size:12px;color:var(--muted)}
.strip .v{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-top:3px}
.strip .v small{font-size:11.5px;font-weight:600;color:var(--muted2);margin-left:3px}

/* 员工卡 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;
 cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(30,32,56,.09);border-color:#E2E2F5}
.card .top-row{display:flex;gap:12px;align-items:flex-start}
.ava{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:19px;
 font-weight:800;flex:none;position:relative}
.ava img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.06);border-radius:50%}
.ava .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;
 background:var(--ok);border:2px solid #fff}
.ava.v1{background:linear-gradient(140deg,#EFE9FF,#E2E0FF);color:#5A4CC0}
.ava.v2{background:linear-gradient(140deg,#E9F5FF,#DDE9FF);color:#2F6FB0}
.ava.v3{background:linear-gradient(140deg,#E8F8F0,#DCF1E6);color:#1F7A5A}
.ava.v4{background:linear-gradient(140deg,#FFF2E6,#FCE6D2);color:#A9672A}
.ava.v5{background:linear-gradient(140deg,#F6EDFF,#EBDDFB);color:#7546A8}
.ava.v6{background:linear-gradient(140deg,#EBF6FA,#D9EDF6);color:#25738F}
.ava.lg{width:84px;height:84px;border-radius:50%;font-size:30px}
.card h3{font-size:16.5px;font-weight:700;letter-spacing:-.2px;line-height:1.35}
.card .role{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
 border-radius:999px;padding:2px 8px;line-height:1.6}
.pill.on{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.off{background:#F3F3F8;color:#858A9E}
.card .status{position:absolute;top:18px;right:18px}
.card .intro{font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:12px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.card .mx{display:flex;align-items:flex-end;gap:10px;margin-top:14px;padding-top:13px;
 border-top:1px solid var(--line2)}
.card .mx .lb{font-size:11.5px;color:var(--muted2)}
.card .mx .val{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.card .mx .val small{font-size:11.5px;font-weight:600;color:var(--muted2);margin-left:2px}
.card .mx .spk{margin-left:auto;margin-bottom:2px}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--muted2)}
.card .foot .go{margin-left:auto;color:var(--accent-ink);font-weight:700}

/* 模板说明 */
.org{margin-top:16px}
.orgroot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;
  background:var(--lav2);border:1px solid var(--lav);border-radius:14px;padding:13px 18px}
.otl b{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.3px}
.otr{font-size:11.5px;color:var(--muted)}
.otr .lnk{color:var(--accent-ink);font-weight:700;text-decoration:none}
.orgrow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:34px;position:relative}
.orgrow:before{content:'';position:absolute;top:-18px;left:10%;right:10%;height:1px;background:var(--line)}
.gtree{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.gtree:before{content:'';position:absolute;top:-18px;left:50%;width:1px;height:18px;background:var(--line)}
.gtree:hover{border-color:var(--lav);box-shadow:0 2px 10px rgba(91,91,255,.08)}
.gtree.sel{border-color:var(--accent);background:var(--lav2);box-shadow:0 0 0 3px rgba(91,91,255,.1)}
.gname{display:flex;align-items:flex-start;gap:8px;font-size:14px;font-weight:700;color:var(--ink);min-height:20px}
.gname span{font-size:11px;font-weight:400;color:var(--muted2)}
.gsub{margin-top:3px;font-size:11.5px;color:var(--accent-ink);font-weight:600;display:flex;gap:8px;align-items:center}
.gst{margin-left:auto;font-size:11px;font-weight:700;line-height:1;padding:3px 7px;border-radius:6px;flex:none}
.gst.soon{color:var(--warn);background:#FBF1DF}
.gst.wait{color:var(--muted2);background:var(--line)}
.gduty{margin-top:7px;font-size:11.5px;line-height:1.7;color:var(--muted);min-height:38px}
.gmems{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:7px;border-top:1px dashed var(--line);padding-top:10px}
.gm{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}
.gm em{font-style:normal;font-weight:600}
.gm b{margin-left:auto;font-weight:700;color:var(--ink)}
.gmav{width:20px;height:20px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;
  background:var(--lav);font-size:10px;font-weight:700;color:var(--accent-ink)}
.gmav img{width:100%;height:100%;object-fit:cover}
.gsec{margin-top:18px}
.ghead{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px}
.ghead b{font-size:13px;font-weight:700;color:var(--ink)}
.ghead span{font-size:11.5px;color:var(--muted)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;padding:18px 20px}
.note h4{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.note h4 span{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--lav);border-radius:6px;padding:2px 7px}
.note p{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.8}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:900px){.steps{grid-template-columns:1fr}}
.step{background:var(--lav2);border:1px solid #EDEDFB;border-radius:12px;padding:12px 14px}
.step b{display:block;font-size:12.5px;color:var(--accent-ink);margin-bottom:4px}
.step span{font-size:12px;color:var(--muted);line-height:1.7}

/* 员工工作台 */
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.back:hover{color:var(--accent)}
.back .ic{width:14px;height:14px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;
 display:flex;gap:20px;align-items:flex-start}
.hero .txt{flex:1;min-width:0}
.hero .nm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero h2{font-size:23px;font-weight:700;letter-spacing:-.3px}
.hero .role{font-size:13px;color:var(--muted);margin-top:3px}
.hero .say{font-size:13px;color:var(--ink2);line-height:1.8;margin-top:12px;max-width:720px;
 background:var(--lav2);border-radius:12px;padding:11px 14px;position:relative}
.hero .say q{quotes:none}
.hero .meta{display:flex;gap:22px;margin-top:13px;flex-wrap:wrap}
.hero .meta div{font-size:11.5px;color:var(--muted2)}
.hero .meta b{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-top:1px}
.hero .today{display:flex;gap:10px;flex:none}
.mini{background:var(--lav2);border-radius:12px;padding:10px 14px;min-width:96px;text-align:center}
.mini .k{font-size:11px;color:var(--muted2)}
.mini .v{font-size:19px;font-weight:700;margin-top:2px;letter-spacing:-.4px}
.mini .s{font-size:10.5px;color:var(--muted2);margin-top:3px}

/* 区块 */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;padding:20px 22px}
.sec > header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sec h4{font-size:15px;font-weight:700;letter-spacing:-.1px}
.sec .hint{font-size:11.5px;color:var(--muted2);margin-left:auto}
.duty{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (max-width:1000px){.duty{grid-template-columns:1fr}}
.duty li{list-style:none;display:flex;gap:10px;background:var(--lav2);border-radius:11px;padding:11px 13px;
 font-size:12.5px;line-height:1.7;color:var(--ink2)}
.duty li.wide{grid-column:1/-1}
.duty li i{width:20px;height:20px;border-radius:50%;background:#fff;color:var(--accent-ink);
 font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}

/* 考评 */
.score{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px;align-items:start}
@media (max-width:1080px){.score{grid-template-columns:1fr}}
.star{background:linear-gradient(160deg,#FBFAFF,#F4F2FF);border:1px solid #E9E6FC;border-radius:14px;padding:16px 18px}
.star .topline{display:flex;align-items:baseline;gap:8px}
.star .lb{font-size:12.5px;color:var(--ink2);font-weight:600}
.star .tagm{font-size:10.5px;font-weight:700;color:var(--accent-ink);background:#fff;border-radius:5px;padding:1px 6px}
.star .big{font-size:38px;font-weight:700;letter-spacing:-1.4px;line-height:1.15;margin-top:6px}
.star .big small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.star .goal{font-size:11.5px;color:var(--muted);margin-top:2px}
.star .plain{font-size:12px;color:var(--ink2);line-height:1.75;margin-top:9px}
.star .fml{font-size:11px;color:var(--muted2);margin-top:7px;border-top:1px dashed #E2DEF6;padding-top:7px}
.star .cmp{font-size:11.5px;color:var(--muted);margin-top:9px;background:#fff;border-radius:8px;padding:7px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.star .cmp b{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.star .cmp .mv{font-weight:700;border-radius:5px;padding:1px 5px;font-size:10.5px}
.mcard{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:14px;
 background:linear-gradient(160deg,#FBFAFF,#F4F2FF);border:1px solid #E9E6FC;border-radius:14px;padding:18px 20px}
@media (max-width:1080px){.mcard{grid-template-columns:1fr}}
.mcard .lb{font-size:12.5px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px}
.mcard .lb .dir{font-size:11px;color:var(--muted2);font-weight:500}
.mcard .big{font-size:42px;font-weight:700;letter-spacing:-1.6px;line-height:1.1;margin-top:6px}
.mcard .big small{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.mcard .goal{font-size:11.5px;color:var(--muted);margin-top:2px}
.mcard .plain{font-size:12.5px;color:var(--ink2);line-height:1.8;margin-top:10px}
.mcr{display:flex;flex-direction:column;gap:9px}
.mcr .fml{font-size:11.5px;color:var(--muted);background:#fff;border-radius:9px;padding:9px 12px;line-height:1.7}
.split{display:flex;gap:9px}
.split div{flex:1;background:#fff;border-radius:9px;padding:8px 11px}
.split span{display:block;font-size:10.5px;color:var(--muted2)}
.split b{display:block;font-size:17px;font-weight:700;margin-top:1px;letter-spacing:-.3px}
.mcr .cmp{font-size:11.5px;color:var(--muted);background:#fff;border-radius:9px;padding:8px 11px;display:flex;gap:6px;align-items:center}
.mcr .cmp b{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.mcr .cmp .mv{font-weight:700;border-radius:5px;padding:1px 5px;font-size:10.5px}
.guard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.guard .r1{display:flex;align-items:baseline;gap:8px}
.guard .lb{font-size:12.5px;font-weight:600;color:var(--ink2)}
.guard .t{font-size:10.5px;color:var(--muted2);background:var(--lav2);border-radius:5px;padding:1px 6px}
.guard .v{margin-left:auto;font-size:17px;font-weight:700;letter-spacing:-.3px}
.guard .v small{font-size:11px;color:var(--muted2);font-weight:600;margin-left:2px}
.guard .plain{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:3px}

.bad{color:var(--bad)}.warnc{color:var(--warn)}.okc{color:var(--ok)}

/* 图表 */
.chartbox{margin-top:14px;position:relative}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:16px;height:2px;border-radius:2px;margin-right:5px;vertical-align:2px}
.legend .t1{background:var(--accent)}
.legend .t2{background:#C9C9F2}
.alert{margin-top:10px;background:var(--bad-bg);border-radius:10px;padding:9px 12px;font-size:12px;
 color:#9E3B36;line-height:1.7}
.alert.ok{background:var(--ok-bg);color:#136F4F}
svg.chart{width:100%;height:auto;display:block;max-width:100%}

/* 每日表 */
table.daily{margin-top:12px;table-layout:fixed}
table.daily th,table.daily td{text-align:left;padding:0 12px;height:46px;border-bottom:1px solid var(--line2);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
table.daily th{font-size:12px;color:var(--muted);font-weight:500;height:38px;background:#FCFCFF}
table.daily td.n{text-align:right;font-variant-numeric:tabular-nums}
table.daily tbody tr{cursor:pointer}
table.daily tbody tr:hover{background:#FAFAFF}
table.daily tbody tr:last-child td{border-bottom:0}
table.daily .go{color:var(--accent-ink);font-weight:700;font-size:12px}
.daycell{display:flex;align-items:center;gap:8px}
.daycell b{font-weight:600}
.daycell span{font-size:11px;color:var(--muted2)}

/* 指标模板页 */
.tpl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden}
.tpl header{padding:17px 20px 14px;display:flex;align-items:center;gap:10px}
.tpl header h3{font-size:15.5px}
.tpl header .hint{margin-left:auto;font-size:11.5px;color:var(--muted2)}
table.tpl-t{font-size:12.5px}
table.tpl-t th,table.tpl-t td{padding:11px 14px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
table.tpl-t th{font-size:12px;color:var(--muted);font-weight:500;background:#FCFCFF}
table.tpl-t td b{font-weight:600;color:var(--ink2)}

/* 职责卡 / 下钻页 */

 border-radius:6px;padding:1px 7px;width:fit-content}

.dcard p{font-size:11.5px;color:var(--muted);line-height:1.8;margin:0}

table.rules{table-layout:fixed;width:100%}
table.rules th,table.rules td{padding:11px 12px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
table.rules th{font-size:12px;color:var(--muted);font-weight:500;background:#FCFCFF;padding:9px 12px}
table.rules tbody tr:last-child td{border-bottom:0}
.rules-controls{display:flex;gap:8px;margin-left:auto}
.rules-section > header{margin-bottom:16px}
.rules-table-wrap{overflow-x:auto}
.rules-section table.rules{min-width:740px}
.rules-section table.rules th,.rules-section table.rules td{padding:14px 12px;vertical-align:middle}
.rules-section table.rules th{padding-top:10px;padding-bottom:10px}
.rules-section table.rules .rule-history{text-align:right;color:var(--muted2);font-size:12px;font-variant-numeric:tabular-nums}
.rules-section table.rules .rule-operation{text-align:right;white-space:nowrap}
.rule-input,.rule-mode{display:block;width:100%;border:1px solid #DDDDEB;border-radius:8px;background:#fff;padding:8px 10px;font:inherit;color:var(--ink2);box-sizing:border-box}
.rule-input:focus,.rule-mode:focus{outline:2px solid var(--lav);border-color:var(--accent)}

.rule-description{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.7;color:var(--ink2)}

.rules-error:empty{display:none}
.lcfg{display:flex;align-items:center;gap:14px;margin-top:18px;background:#FBFBFE;
 border:1px solid var(--line);border-radius:14px;padding:13px 16px}
.lcfg span{display:block;font-size:11px;color:var(--muted2)}
.lcfg b{font-size:15px;font-weight:800}
.lcfg i{display:block;font-size:11px;color:var(--muted2);font-style:normal;margin-top:2px}
.lcfg .btn{margin-left:auto}
.tinp{font:inherit;font-weight:800;font-size:15px;width:86px;border:1px solid #C9C9F2;
 border-radius:8px;padding:3px 8px;background:#fff;color:var(--ink)}

.lgh{display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--line2)}

.lrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #F7F7FB}

.lfrom{font-size:10.5px;color:var(--muted2);margin-left:auto;white-space:nowrap}

/* 内容核检台 */
.seg{display:flex;gap:3px;background:#F3F3FA;border-radius:9px;padding:3px}
.seg button{padding:4px 11px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--muted)}

.qbar{display:flex;align-items:center;gap:12px;margin-top:18px}

  font-family:inherit;color:var(--ink2);padding:0 26px 0 10px;cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%23787C94'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center}
.qsel:hover{border-color:var(--lav)}
.qsel:focus{outline:none;border-color:var(--accent)}

.qtabs{display:flex;gap:4px;background:#F3F3FA;border-radius:11px;padding:4px}

 display:flex;align-items:center;gap:6px}

.qtabs .cnt{font-size:11px;font-weight:700;border-radius:5px;padding:1px 5px;background:var(--lav);color:var(--accent-ink)}
.qtabs button.on .cnt{background:var(--accent);color:#fff}
.qmeta{margin-left:auto;font-size:11.5px;color:var(--muted2)}
table.q{margin-top:14px;table-layout:fixed}
table.q th,table.q td{padding:12px 12px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
table.q th{font-size:12px;color:var(--muted);font-weight:500;background:#FCFCFF;padding:9px 12px}
table.q tbody tr{cursor:pointer}
table.q tbody tr:hover{background:#FAFAFF}
table.q tbody tr:last-child td{border-bottom:0}
.q-title{font-size:13px;font-weight:600;color:var(--ink);line-height:1.5}
.q-comment{font-size:13px;font-weight:400;color:var(--ink2);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.q-sub{font-size:11px;color:var(--muted2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;line-height:1.7}
.tag.p0{background:var(--bad-bg);color:var(--bad)}
.tag.p1{background:var(--warn-bg);color:var(--warn)}
.tag.p2{background:#EFF1F8;color:#7B7F96}

.tag.ty.plain{background:#F7F7FB;color:#9CA0B4}
.stg{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 7px;line-height:1.7}
.stg.wait{background:var(--warn-bg);color:var(--warn)}
.stg.ok{background:var(--ok-bg);color:var(--ok)}
.stg.chg{background:#F1EEFE;color:#6B4FBB}
.stg.ai{background:#EEF3FF;color:#2E6BB0}
.stg.bad{background:var(--bad-bg);color:var(--bad)}
.dnone{font-size:12px;color:var(--muted2);margin-top:8px}
.dlist{margin-top:2px}
.dlrow{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.dlrow:hover{background:var(--lav2);border-radius:10px}
.dlt{flex:1;min-width:0}
.dlt b{display:block;font-size:13px;font-weight:600;color:var(--ink);line-height:1.55}
.dlt span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.dlrow .stg{flex:none}
.wait-t{font-size:10.5px;color:var(--muted2)}

.kind{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:#F4F4FA;color:#6B6F8E}
.kind.c{background:#F2F6FF;color:#3C6BA8}
.alert.info{background:var(--lav);color:var(--accent-ink)}
.q-empty{padding:46px 10px;text-align:center;color:var(--muted2);font-size:12.5px}
.detail-body{font-size:13px;line-height:1.9;color:var(--ink2);background:#FAFAFE;border:1px solid var(--line2);
 border-radius:12px;padding:14px 16px}
.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.detail-meta div{padding:10px 12px;border:1px solid var(--line);border-radius:11px}
.detail-meta span{display:block;font-size:10.5px;color:var(--muted2)}
.detail-meta b{display:block;font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.5}
.detail-meta i{display:block;font-size:11px;color:var(--muted2);font-style:normal;margin-top:2px}
.dblock{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dblock .dh2{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.lean{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px}
.lean.pass{background:var(--ok-bg);color:var(--ok)}

.dacts{display:flex;gap:9px;margin-top:16px}
.btn[disabled]{opacity:.42;cursor:default}

.review-input{display:block;width:100%;min-height:108px;resize:vertical;padding:10px 12px;border:1px solid #DDDDEB;border-radius:10px;background:#fff;font:inherit;color:var(--ink);line-height:1.7;box-sizing:border-box}
.review-input:focus{outline:2px solid var(--lav);border-color:var(--accent)}

.review-result-reason{margin-top:16px}
.review-result-label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.review-result-text{font-size:13px;line-height:1.8;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.review-result-footer{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;border-top:1px solid var(--line);padding-top:11px;margin-top:16px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}

/* 抽屉 */
.scrim{position:fixed;inset:0;background:rgba(22,24,45,.34);opacity:0;pointer-events:none;transition:.24s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}

 box-shadow:-20px 0 60px rgba(20,22,45,.16);transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,.28,1);
 display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.dh{padding:20px 22px 14px;border-bottom:1px solid var(--line);flex:none;position:relative}
.dh h3{font-size:17px;font-weight:700}
.dh p{font-size:12px;color:var(--muted);margin-top:4px}

.item .verdict div{font-size:11.5px;color:var(--muted2)}
.item .verdict div b{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin-top:2px}
.risk{font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px}

.risk.p1{background:var(--warn-bg);color:var(--warn)}

/* 弹窗 */
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:520px;max-width:94vw;
 background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(20,22,45,.24);opacity:0;pointer-events:none;
 transition:.2s;z-index:50;padding:22px 24px}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:17px;font-weight:700}

.modal label{font-size:12px;color:var(--muted)}

 padding:0 12px;font-size:13px;outline:none}
.modal input:focus,.modal select:focus{border-color:#C9C9F7;background:#fff;box-shadow:0 0 0 3px rgba(91,91,255,.08)}
.modal .tip{font-size:11.5px;color:var(--muted2);background:var(--lav2);border-radius:9px;padding:9px 11px;margin-top:14px;line-height:1.7}
.modal .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,8px);background:#25273C;color:#fff;
 font-size:12.5px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.22s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

function seriesOf(emp){
  if(emp.id==='an') return anDailyRows(30).filter(day=>day.rate!==null).reverse().map(day=>({d:day.date.slice(5),v:day.rate}));
  const d=emp.metric.days, s=emp.metric.series.slice(-d);
  const today=new Date(2026,10,16);
  return s.map((v,i)=>{const dt=new Date(today); dt.setDate(dt.getDate()-(d-1-i));
    return {d:`${dt.getMonth()+1}-${dt.getDate()}`, v};});

/* 折线图 */
function chart(series, opt={}){
  const t=opt.target;
  const w=1120, h=opt.h||300, pad={l:t!=null?88:46,r:30,t:56,b:36};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const vals=series.map(s=>s.v);
  const all=t!=null?vals.concat([t]):vals;
  let mn=Math.min(...all), mx=Math.max(...all);
  const sp=(mx-mn)||0.1; mn-=sp*0.16; mx+=sp*0.20;
  const X=i=>pad.l+(series.length<2?iw/2:i*(iw/(series.length-1)));
  const Y=v=>pad.t+ih-((v-mn)/(mx-mn))*ih;
  const pts=series.map((s,i)=>[X(i),Y(s.v)]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=`M${pts[0][0]},${pad.t+ih} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${pad.t+ih} Z`;
  // 网格（不标刻度，数值逐点标注）
  let grid='';
  for(let g=0;g<3;g++){
    const y=Y(mn+(mx-mn)*(g/2));
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#F2F2F9"/>`;
  }
  let tline='',tlab='';
  if(t!=null){
    const y=Y(t);
    tline=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#C9C9F2" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    tlab=`<text x="8" y="${y-6}" text-anchor="start" font-size="10.5" fill="#8B8FB0">目标 ${fmt(t,opt.unit)}</text>`;
  }
  // 每个点都标数值（末点用高亮气泡代替），单位统一跟在数上
  const n=series.length, fs=n<=7?11:10;
  let vlab='';
  series.forEach((d,i)=>{
    if(i===n-1) return;
    vlab+=`<text x="${X(i)}" y="${Y(d.v)-10}" text-anchor="middle" font-size="${fs}" fill="#6F739B">${labOf(d.v)}${opt.unit||''}</text>`;
  });
  // 日期：点少时每天都标，点多时隔几个标
  const xstep = n<=7?1:(n<=14?2:5);
  let xlab='';
  series.forEach((d,i)=>{
    if(i===0||i===n-1||i%xstep===0)
      xlab+=`<text x="${X(i)}" y="${h-12}" text-anchor="middle" font-size="10" fill="#A9ADC1">${d.d}</text>`;
  });
  const last=pts[pts.length-1];
  const lastTxt=labOf(series[series.length-1].v)+(opt.unit||'');
  const bw=Math.max(46,lastTxt.length*7+16);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:${h}px">
    <defs><linearGradient id="g${opt.gid||''}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B5BFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#5B5BFF" stop-opacity="0"/></linearGradient></defs>
    ${grid}${tline}${tlab}
    <path d="${area}" fill="url(#g${opt.gid||''})"/>
    <polyline points="${line}" fill="none" stroke="#5B5BFF" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="${n<=7?4.2:3.6}" fill="#5B5BFF"/>
    <rect x="${last[0]-bw/2}" y="${last[1]-30}" width="${bw}" height="19" rx="9.5" fill="#fff" stroke="#C9C9F2"/>
    <text x="${last[0]}" y="${last[1]-16}" text-anchor="middle" font-size="11" font-weight="700" fill="#4A4ADE">${lastTxt}</text>
    ${vlab}${xlab}
  </svg>`;
}
function labOf(v){ const r=Math.round(v*10)/10; return Number.isInteger(r)?String(r):r.toFixed(1); }
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length;}
function fmtNum(v,unit){return unit==='‰'?v.toFixed(2):Math.round(v)+'';}
function fmtLast(v,unit){ return unit==='%'?(Math.round(v*10)/10)+'%':fmt(v,unit); }
function fmt(v,unit){
  if(unit==='‰') return v.toFixed(2);
  if(unit==='%') return Math.round(v)+'%';
  return (Math.round(v*10)/10).toString();
}
function spark(series,color){
  if(series.length<2) return '';
  const vals=series.slice(-14).map(s=>s.v);
  const w=64,h=26,mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const pts=vals.map((v,i)=>[i*(w/(vals.length-1)), h-2-((v-mn)/sp)*(h-6)]);
  return `<svg class="spk" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color||'#5B5BFF'}" stroke-width="1.6" opacity=".85"/></svg>`;
}
function dayPair(e,r){
  const rc=e.work.rate||{num:'adopted',den:'handled'};
  return `${r[rc.num]}/${r[rc.den]}`;
}
function dayRate(e,r){
  const rc=e.work.rate||{num:'adopted',den:'handled'};
  const den=r[rc.den];
  if(!den) return '—';
  return Math.round(r[rc.num]/den*100)+'%';
}
function statusPill(s){
  const c = s==='在线'?'on' : s==='待补充'?'warn':'off';
  return `<span class="pill ${c}">${s}</span>`;
}

/* ═══ 每日下钻 ═══ */
function openDay(e,day){
  if(e.id==='an'){
    anLogState={range:'custom',from:day,to:day,search:'',type:'全部',page:1};
    route={v:'emp',id:'an'};render();return;
  }
  const row=e.work.rows.find(r=>r.date===day);
  const items=(e.work.items[day])||[];
  const lean=it=>it.agent.indexOf('放行')>-1?'放行':'拦截';
  const verdict=it=>it.human.indexOf('改判')>-1?'bad':(it.human.indexOf('补')>-1?'wait':'ok');
  $('#dTitle').textContent=`${day} 的核检记录`;
  $('#dSub').innerHTML=`<span class="stg ${row.st==='低于目标'?'wait':'ok'}">${row.st}</span>
    <span class="wait-t" style="margin-left:8px">处理 ${row.handled} 件${row.pool!=null?` · 交给人 ${row.pool} 件 · 人直接采纳 ${row.adopted} 件`:''}</span>`;
  $('#dBody').innerHTML = items.length? `
    <div class="dlist">
      ${items.map((it,i)=>`<div class="dlrow" data-di="${i}">
        <div class="dlt"><b>${it.title}</b><span>${it.risk!=='—'?it.risk+' · ':''}我倾向${lean(it)}</span></div>
        <span class="stg ${verdict(it)}">${it.human}</span>
      </div>`).join('')}
    </div>` :
    `<div style="padding:40px 10px;text-align:center;color:var(--muted2)">这一天没有需要人介入的内容。</div>`;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
  $$('#dBody .dlrow').forEach(tr=>tr.onclick=()=>openDayItem(e,day,+tr.dataset.di));
}

function openDayItem(e,day,i){
  const items=(e.work.items[day])||[];
  const it=items[i]; if(!it) return;
  const leanTxt=it.agent.indexOf('放行')>-1?'放行':'拦截';
  const why=(it.agent.match(/（(.+)）/s)||[,''])[1]||it.agent;
  $('#dTitle').textContent=it.title;
  $('#dSub').innerHTML=`<span class="wait-t">${day} · ${e.name} 的核检记录</span>`;
  $('#dBody').innerHTML=`
    <div id="dBackList" style="font-size:12px;font-weight:700;color:var(--accent-ink);cursor:pointer;margin-bottom:12px">← 回到这一天的列表</div>
    <div class="detail-body">${it.quote}</div>
    <div class="detail-meta">

    <div class="dblock">
      <div class="dh2">我的判断</div>
      <div class="lean ${leanTxt==='拦截'?'stop':'pass'}">倾向${leanTxt}</div>
      <p class="dwhy">依据：${why}</p>

    <div class="dblock">
      <div class="dh2">人工确认</div>

/* ═══ 内容核检台 ═══ */
let kbtab='all';
let qtab='wait';
let qFrom='nav';   // 从哪进来：nav=侧边栏，emp=员工工作台
let qModel='全部', qTopic='全部', qTime='全部', qType='全部';   // 从哪进来：nav=侧边栏，emp=员工工作台
// 历史示例保留处理动作，列表统一展示待处理或已处理。
QUEUE.forEach(item => {
  const previousStatus = item.status;
  if (previousStatus === '待处理') return;
  if (previousStatus === '已采纳' || previousStatus === '已改判') {
    item.manual_result = {
      decision: previousStatus === '已采纳'
        ? (item.lean === '放行' ? 'allow' : 'reject')
        : (item.lean === '放行' ? 'reject' : 'allow'),
      reason: item.note || item.why,
      action: previousStatus === '已采纳' ? '采纳' : '改判'
    };
  }
  item.status = '已处理';
});

function escapeReviewText(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function contentLabel(item){
  if((item.type||item.kind)!=='评论') return item.title||item.t||'';
  const characters=Array.from((item.body||'').replace(/\s+/g,' ').trim());
  return characters.slice(0,90).join('')+(characters.length>90?'…':'');
}

  $('#wrap').innerHTML=`<button class="back" id="backEmp">${IC_BACK}${qFrom==='emp'?'回到安小检工作台':'回到 AI 数字员工'}</button>

      <label class="filter-field" for="fTopic"><span class="filter-label">话题</span><select class="qsel" id="fTopic">${options(['全部',...new Set(scoped.map(item=>item.topic))],qTopic)}</select></label>

  const revision=item.review_revision;

  if(item.review_revision!==revision){
    upsertKnowledgeCase(item);syncAnSummary();syncAnLearningRecords();
    if(route.v==='queue')renderQueue();else if(route.v==='emp'&&route.id==='an')renderAnHome();
  }
  const pending=item.status==='待处理',review=item.manual_result;
  const reverse=item.lean==='拦截'?'放行':'拦截';
  activeReview={id,contentVersion:item.version||1,revision:item.review_revision||0};
  $('#dTitle').textContent=item.type==='评论'?'评论详情':item.title;
  $('#dSub').innerHTML=`<span class="kind">${item.type}</span> <span class="stg ${pending?'wait':'ok'}">${item.status}</span> <span class="stg">${marketName(item.country)}</span>`;
  $('#dBody').innerHTML=`<div class="detail-body">${escapeReviewText(item.body)}</div>${renderReplyContext(item)}

function actItem(id,action){
  const item=QUEUE.find(record=>record.id===id);if(!item)return;
  const stored=readStoredReview(item);
  if(stored?.content_version===(item.version||1)&&stored.review_revision>(activeReview?.revision||0)){
    applyStoredReview(item,stored);upsertKnowledgeCase(item);syncAnSummary();syncAnLearningRecords();openItem(id);
    toast('该内容已由 '+stored.handler+' 处理，已刷新最终结果。');return;
  }
  if(item.status!=='待处理'){openItem(id);toast('该内容已处理，请查看最终结果。');return;}
  if(activeReview?.id!==id||activeReview.contentVersion!==(item.version||1)||activeReview.revision!==(item.review_revision||0)){
    openItem(id);toast('内容版本已更新，请重新审核。');return;
  }
  if(!['采纳','改判'].includes(action)||!['allow','reject'].includes(item.ai_review_leaning))return;
  const candidates=route.v==='queue'?queueItems(true):anLogItems().filter(record=>record.status==='待处理');
  const index=candidates.findIndex(record=>record.id===id);
  const next=candidates[index+1]||candidates.find(record=>record.id!==id);
  const suggestion=$('#reviewAdvice').value.trim();
  const ai=item.ai_review_leaning;
  const decision=action==='采纳'?ai:ai==='allow'?'reject':'allow';
  const label=decision==='allow'?'放行':'拦截';
  const result={decision,reason:suggestion||(action==='采纳'?item.why:`人工复核后改判为${label}。`),action,suggestion,reason_source:suggestion?'manual_input':action==='采纳'?'ai_reason':'manual_decision',reviewer_id:'admin_007'};
  const handledAt=AN_TODAY.slice(5)+' '+currentClock();
  const record={content_version:item.version||1,review_revision:(item.review_revision||0)+1,manual_result:result,handler:'张三 · 总部',handledAt};
  try{localStorage.setItem('aibuddy.an.v2.review.'+id,JSON.stringify(record));}catch{$('#reviewSubmitError').textContent='保存失败，请重试；本次复核尚未提交。';return;}
  applyStoredReview(item,record);upsertKnowledgeCase(item);syncAnSummary();syncAnLearningRecords();
  $('#drawer').classList.remove('on');$('#scrim').classList.remove('on');$('#dReviewFooter').hidden=true;
  if(route.v==='queue')renderQueue();else renderAnHome();
  if(reviewContinue&&next)openItem(next.id);
  toast(reviewContinue&&!next?'当前筛选下的待复核内容已全部处理。':'复核完成，最终结果：'+label);
}

function learnStatus(item){
  const matches=entry=>entry.case_id===item.case_id;
  const hit=LEARN.today.items.find(matches);
  if(hit) return hit.st;
  for(const h of LEARN.hist){const found=h.items.find(matches);if(found)return found.st;}
  return '待处理';
}

function knowledgeCaseType(item){
  const leaning=item.review_leaning || (item.ai==='放行'?'allow':item.ai==='拦截'?'reject':null);
  if(!['allow','reject'].includes(leaning))return null;
  return (leaning==='allow')===item.ok?'good':'bad';
}

function knowledgeCaseLabel(type){
  return {good:'正向案例',bad:'负向案例'}[type];
}

function knowledgeItems(){
  const items=marketItems([...KB.good,...KB.bad]).filter(item=>knowledgeCaseType(item)).sort((a,b)=>b.when.localeCompare(a.when));
  return kbtab==='all'?items:items.filter(item=>knowledgeCaseType(item)===kbtab);
}

function upsertKnowledgeCase(item){
  if(!item.manual_result||!['allow','reject'].includes(item.ai_review_leaning))return;
  const all=[...KB.good,...KB.bad];
  let entry=all.find(record=>record.source_id===item.id) || all.find(record=>
    !record.source_id&&record.kind===item.type&&record.author===item.author&&
    (item.type==='评论'?record.body===item.body:record.t===item.title));
  if(!entry) entry={};
  entry.case_id=entry.case_id||'case_'+item.id;
  for(const bucket of [KB.good,KB.bad]){
    const index=bucket.indexOf(entry);
    if(index!==-1) bucket.splice(index,1);
  }
  const leaning=item.ai_review_leaning;
  Object.assign(entry,{
    source_id:item.id,country:item.country,t:item.title,kind:item.type,topic:item.topic,body:item.body,
    author:item.author,store:item.store,time:item.time,model:item.model,stats:item.stats,
    who:item.handler,when:item.handledAt,
    parent:item.parent||entry.parent,
    ai:leaning==='allow'?'放行':'拦截',
    review_leaning:leaning,aiWhy:item.why,ok:item.manual_result.decision==='allow',reason:item.manual_result.reason
  });
  (entry.ok?KB.good:KB.bad).unshift(entry);
}

function anDayOffset(day,offset){
  return new Date(Date.parse(day+'T00:00:00Z')+offset*86400000).toISOString().slice(0,10);
}

function initializeAnRecords(){
  const offsets={q1:0,q2:0,q3:0,q4:0,q5:1,q6:1,q7:2,q8:3,q9:1,q10:0,q11:0,q12:0,q13:3,q14:4,q15:4,q16:5,q17:6};
  const reasons={
    q3:'内容描述门店活动，但涉及宗教节日与促销结合，建议由当地人员核实表达边界。',
    q4:'表达接近日常议价，但包含价差保证和退差承诺，需要人工确认门店是否有对应政策。',
    q5:'内容用于讲解屏幕卖点，但防近视等表述需要核查产品依据。',
    q8:'作者提到个人续航体验，但三天续航及比较结论需要结合使用条件核实。',
    q9:'内容是节日期间的促销活动，涉及当地宗教语境，需要人工确认是否适宜。',
    q14:'帖子讲解屏幕卖点，但看多久都不伤眼是绝对化健康表述，需要核查依据。'
  };
  QUEUE.forEach(item=>{
    const day=anDayOffset(AN_TODAY,-offsets[item.id]);
    const clock=item.time.split(' ')[1]||'10:00';
    item.audit_at=day+' '+clock;
    item.time=day.slice(5)+' '+clock;
    item.ai_decision=item.status==='待处理'||item.manual_result?'review':(item.lean==='放行'?'allow':'reject');
    item.ai_review_leaning=item.ai_decision==='review'?(item.review_leaning||(item.lean==='放行'?'allow':'reject')):null;
    if(reasons[item.id]) item.why=reasons[item.id];
    if(item.handledAt) item.handledAt=day.slice(5)+' '+(item.handledAt.split(' ')[1]||clock);
    if(item.type==='评论') item.title=null;
  });
  [...KB.good,...KB.bad].forEach((item,index)=>{
    item.case_id='legacy_case_'+index;
    if(item.kind==='评论')item.t=null;
  });
  expandAnDemoRecords();
  initializeAnContext();
  QUEUE.forEach(upsertKnowledgeCase);
  initializeLearningRuns();
  syncAnLearningRecords();
  syncAnSummary();
}

function anRowsBetween(from,to,market="全部"){
  return QUEUE.filter(item=>(market==="全部"||item.country===market)&&item.audit_at.slice(0,10)>=from&&item.audit_at.slice(0,10)<=to);
}

function anSummary(items){
  const reviewed=items.filter(item=>item.manual_result&&['allow','reject'].includes(item.ai_review_leaning));
  const adopted=reviewed.filter(item=>item.manual_result.action==='采纳').length;
  return {
    total:items.length,
    autoAllow:items.filter(item=>item.ai_decision==='allow').length,
    autoReject:items.filter(item=>item.ai_decision==='reject').length,
    pool:items.filter(item=>item.ai_decision==='review').length,
    reviewed:reviewed.length,adopted,
    changed:reviewed.length-adopted,
    rate:reviewed.length?Math.round(adopted/reviewed.length*1000)/10:null
  };
}

function anDailyRows(days){
  return Array.from({length:days},(_,index)=>{
    const date=anDayOffset(AN_TODAY,-index);
    return {date,...anSummary(anRowsBetween(date,date))};
  });
}

function syncAnSummary(){
  const employee=EMPLOYEES.find(item=>item.id==='an');
  const recent=anSummary(QUEUE.filter(item=>item.audit_at.slice(0,10)>=anDayOffset(AN_TODAY,-6)&&item.audit_at.slice(0,10)<=AN_TODAY));
  employee.work.rows=Array.from({length:7},(_,index)=>{
    const date=anDayOffset(AN_TODAY,-index);
    return {date,...anSummary(QUEUE.filter(item=>item.audit_at.startsWith(date)))};
  }).map(row=>({
    date:row.date,w:row.date===AN_TODAY?'今天':'',handled:row.total,
    auto:row.autoAllow+row.autoReject,pool:row.pool,adopted:row.adopted,
    st:row.rate===null?'—':row.rate>=employee.metric.target_v?'正常':'低于目标'
  }));
  employee.metric.value=recent.rate===null?'—':String(recent.rate);
  employee.metric.noteLevel=recent.rate!==null&&recent.rate>=employee.metric.target_v?'good':'warn';
  employee.metric.formula='人工采纳数 ÷（人工采纳数＋人工改判数）× 100%';
  employee.metric.plain='统计已完成的人工复核：采纳 AI 判断计入采纳数，改判计入改判数；待处理记录不参与计算。';
  employee.metric.note='近 7 天人工采纳 '+recent.adopted+' 条，人工改判 '+recent.changed+' 条。';
  employee.scope=[...new Set(QUEUE.map(item=>item.country))].map(marketName).join(' / ');
}

  if(['emp','an-analysis'].includes(route.v)&&route.id==='an') rememberAnPosition();

    qFrom='emp';qtab='wait';qModel='全部';qTopic='全部';qTime='全部';qType='全部';qPage=1;qSearch='';

  route={v:view,id:'an',...(key?{k:key}:{})};
  render();
  if($('.main')) $('.main').scrollTop=0;
}

function anLogItems(){
  const query=anLogState.search.trim().toLocaleLowerCase();
  return anRowsBetween(anLogState.from,anLogState.to,anMarket)
    .filter(item=>(anLogState.type==='全部'||item.type===anLogState.type)&&
      (!query||[item.title,item.body,item.author].some(value=>String(value||'').toLocaleLowerCase().includes(query))))
    .sort((a,b)=>b.audit_at.localeCompare(a.audit_at)||a.id.localeCompare(b.id));
}

  if($("#anMarket"))$("#anMarket").onchange=event=>changeAnMarket(event.target.value);

  $('#anPendingAction').onclick=()=>{anMarket='全部';openAnChild('queue');};

  $('#anTabAnalysis').onclick=showAnalysis;
  $('#anTabRole').onclick=()=>switchAnTab('role');

  $$('[data-an-duty]').forEach(button=>button.onclick=()=>openAnChild('duty',button.dataset.anDuty));
}

function switchAnTab(tab){
  const view=tab==='analysis'?'an-analysis':'emp';
  if(route.v===view&&route.id==='an'&&(view==='an-analysis'||(route.tab||'role')===tab)) return;
  route={v:view,id:'an',tab};
  render();
}

function renderAnWorkspace(active,content){
  const main=$('.main');
  const scrollTop=main?.scrollTop||0;
  const sameWorkspace=Boolean($('#anWorkspaceHeader')&&$('#anWorkspaceContent'));
  if(sameWorkspace){
    $('#anWorkspaceContent').innerHTML=content;
    const today=anSummary(anRowsBetween(AN_TODAY,AN_TODAY));
    const recent=anSummary(anRowsBetween(anDayOffset(AN_TODAY,-6),AN_TODAY));
    const pending=QUEUE.filter(item=>item.ai_decision==='review'&&item.status==='待处理').length;
    $('#anToday strong').innerHTML=`${today.total}<small> 条</small>`;
    $('#anPending strong').innerHTML=`${pending}<small> 条</small>`;
    $('#anPerformance strong').textContent=recent.rate===null?'—':recent.rate+'%';

    for(const [id,tab] of [['anTabRole','role'],['anTabAnalysis','analysis'],['anTabWork','work']]){
      $('#'+id).classList.toggle('on',active===tab);
      $('#'+id).setAttribute('aria-current',active===tab?'page':'false');
    }
  } else {
    $('#wrap').innerHTML=`<div id="anWorkspaceHeader">${renderAnHeader(active)}</div><div id="anWorkspaceContent">${content}</div>`;
  }
  bindAnHeader();
  if(main) main.scrollTop=sameWorkspace?scrollTop:0;
}

      <header><h4>工作日志</h4><div class="an-log-tools"><span class="hint">${anLogState.from===anLogState.to?anLogState.from:anLogState.from+' 至 '+anLogState.to}</span>${marketSelector("anMarket")}</div></header>
      <div class="an-filterbar">
        <div class="seg">${[['today','今天'],['yesterday','昨天'],['week','近 7 天'],['custom','自定义日期']].map(([value,label])=>`<button data-an-range="${value}" class="${anLogState.range===value?'on':''}">${label}</button>`).join('')}</div>
        <select class="qsel" id="anType" aria-label="内容类型">${['全部','帖子','评论'].map(type=>`<option ${type===anLogState.type?'selected':''}>${type}</option>`).join('')}</select>
        <form id="anSearchForm" class="an-search"><input id="anSearch" aria-label="搜索内容或发布者" placeholder="搜索内容或发布者" value="${escapeReviewText(anLogState.search)}"><button class="btn sm" type="submit">搜索</button></form>
      </div>
      ${anLogState.range==='custom'?`<form class="an-datebar" id="anDateForm"><label>开始日期<input type="date" id="anFrom" value="${anLogState.from}" max="${AN_TODAY}" required></label><label>结束日期<input type="date" id="anTo" value="${anLogState.to}" max="${AN_TODAY}" required></label><button type="submit" class="btn sm">查询</button><span id="anDateError" role="alert"></span></form>`:''}
      <div class="an-log-summary"><span>本时段审核 <b>${summary.total}</b></span><span>自动放行 <b>${summary.autoAllow}</b></span><span>自动拦截 <b>${summary.autoReject}</b></span><span>转人工 <b>${summary.pool}</b></span></div>
      <div class="an-table-wrap"><table class="an-records"><thead><tr><th>内容</th><th style="width:124px">审核时间</th><th style="width:112px">处理方式</th><th style="width:96px">最终处置</th><th style="width:96px">处理状态</th><th style="width:70px">操作</th></tr></thead><tbody>
      ${shown.map(item=>{
        const waiting=item.status==='待处理';
        const decision=waiting?null:item.manual_result?.decision||item.ai_decision;
        const method=item.ai_decision==='review'?'人工复核':'AI 处理';
        return `<tr><td><button class="an-record-title ${item.type==='评论'?'an-comment':''}" data-an-item="${item.id}">${escapeReviewText(contentLabel(item))}</button><div class="an-record-meta">${item.type} · ${escapeReviewText(item.author)}</div></td><td class="an-time">${item.audit_at.slice(5,10)}<br>${item.audit_at.slice(11)}</td><td>${method}</td><td>${decision?`<span class="lean ${decision==='allow'?'pass':'stop'}">${decision==='allow'?'放行':'拦截'}</span>`:'—'}</td><td><span class="stg ${waiting?'wait':'ok'}">${item.status}</span></td><td><button class="lnk" data-an-item="${item.id}">查看</button></td></tr>`;
      }).join('')||'<tr><td colspan="6" class="q-empty">当前条件下暂无工作记录</td></tr>'}
      </tbody></table></div>
      <div class="an-pagination"><span>共 ${items.length} 条</span><button class="btn sm" id="anPrev" ${anLogState.page===1?'disabled':''}>上一页</button><span>${anLogState.page} / ${pageCount}</span><button class="btn sm" id="anNext" ${anLogState.page===pageCount?'disabled':''}>下一页</button></div>
    </section></div>`);
  bindAnGrowthTabs();
  const chooseRange=value=>{
    anLogState.range=value;anLogState.page=1;
    if(value==='today') anLogState.from=anLogState.to=AN_TODAY;
    if(value==='yesterday') anLogState.from=anLogState.to=anDayOffset(AN_TODAY,-1);
    if(value==='week'){anLogState.from=anDayOffset(AN_TODAY,-6);anLogState.to=AN_TODAY;}
    renderAnHome();
  };
  $$('[data-an-range]').forEach(button=>button.onclick=()=>chooseRange(button.dataset.anRange));
  $('#anType').onchange=event=>{anLogState.type=event.target.value;anLogState.page=1;renderAnHome();};
  $('#anSearchForm').onsubmit=event=>{event.preventDefault();anLogState.search=$('#anSearch').value;anLogState.page=1;renderAnHome();};
  if(anLogState.range==='custom') $('#anDateForm').onsubmit=event=>{
    event.preventDefault();
    const from=$('#anFrom').value,to=$('#anTo').value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to)||from>to||to>AN_TODAY){$('#anDateError').textContent='请选择有效的日期范围，结束日期应在今天或之前。';return;}
    anLogState.from=from;anLogState.to=to;anLogState.page=1;renderAnHome();
  };
  $$('[data-an-item]').forEach(button=>button.onclick=()=>openItem(button.dataset.anItem));
  $('#anPrev').onclick=()=>{if(anLogState.page>1){anLogState.page--;renderAnHome();}};
  $('#anNext').onclick=()=>{if(anLogState.page<pageCount){anLogState.page++;renderAnHome();}};
}

function renderAnAnalysis(){
  const employee=EMPLOYEES.find(item=>item.id==='an');
  const days=anDailyRows(anAnalysisDays);
  const records=anRowsBetween(anDayOffset(AN_TODAY,1-anAnalysisDays),AN_TODAY);
  const summary=anSummary(records);
  const points=days.filter(day=>day.rate!==null).reverse().map(day=>({d:day.date.slice(5),v:day.rate}));
  renderAnWorkspace('analysis',`<div class="head an-analysis-toolbar"><div><h4>建议采纳率</h4><p class="desc">衡量 AI 对人工复核的辅助效果。人工采纳 ÷（人工采纳＋人工改判）× 100%，目标 ${employee.metric.target}。</p></div><div class="act seg">${[7,14,30].map(day=>`<button data-an-analysis="${day}" class="${anAnalysisDays===day?'on':''}">近 ${day} 天</button>`).join('')}</div></div>
    <div class="statrow"><div class="sbox"><span>建议采纳率</span><b>${summary.rate===null?'—':summary.rate+'%'}</b></div><div class="sbox"><span>人工采纳</span><b>${summary.adopted}</b><i>条</i></div><div class="sbox"><span>人工改判</span><b>${summary.changed}</b><i>条</i></div></div>
    <section class="sec"><header><h4>采纳率趋势</h4><span class="hint">目标 ${employee.metric.target} · 按首次审核日期归组</span></header>${points.length?chart(points,{target:employee.metric.target_v,unit:'%',gid:'an-analysis'}):'<div class="q-empty">本时段暂无可计算采纳率的人工复核</div>'}</section>
    <section class="sec"><header><h4>每日明细</h4></header><div class="an-table-wrap"><table class="an-records an-metric-table"><thead><tr><th style="width:116px">日期</th><th>审核总数</th><th>AI 审核</th><th>转人工</th><th>人工采纳</th><th>人工改判</th><th>采纳率</th><th style="width:100px">当天状态</th><th style="width:90px">操作</th></tr></thead><tbody>${days.map(day=>`<tr><td>${day.date}</td><td>${day.total}</td><td>${day.autoAllow+day.autoReject}</td><td>${day.pool}</td><td>${day.adopted}</td><td>${day.changed}</td><td>${day.rate===null?'—':day.rate+'%'}</td><td>${day.rate===null?'—':`<span class="pill ${day.rate>=employee.metric.target_v?'on':'warn'}">${day.rate>=employee.metric.target_v?'正常':'低于目标'}</span>`}</td><td><button class="lnk" data-an-day="${day.date}">查看记录</button></td></tr>`).join('')}</tbody></table></div></section>`);
  $$('[data-an-analysis]').forEach(button=>button.onclick=()=>{anAnalysisDays=Number(button.dataset.anAnalysis);renderAnAnalysis();});
  $$('[data-an-day]').forEach(button=>button.onclick=()=>{anMarket='全部';anLogState={range:'custom',from:button.dataset.anDay,to:button.dataset.anDay,search:'',type:'全部',page:1};route={v:'emp',id:'an',tab:'work',log:'work'};render();});
}

    {title:'这句方言能不能用于接待顾客',body:'我们在 {store} 介绍 {model} 时，有同事想用一句本地俚语夸顾客。当地人有人觉得亲切，也有人觉得冒犯，想请培训师确认适用场景。',counter:'俚语可能冒犯顾客，倾向拦截，交当地培训师核实使用场景。',final:'allow',manual:'当地培训师确认帖子是在讨论措辞边界，未直接冒犯顾客，可以作为内部交流。',topic:'语言与文化'},
    {title:'转述一句售后争执的话，请帮忙确认语境',body:'{store} 讨论 {model} 售后时，有人把一句不完整的激烈表达贴出来，我想先确认是谁说的，再决定能不能用于培训。',counter:'包含激烈表达，倾向拦截，需要人工核实说话者及完整语境。',final:'allow',manual:'结合门店提供的上下文，作者在说明事件处理经过，并未威胁他人。',topic:'售后沟通'},
    {title:'这条带个人调侃的接待话术先请当地同事看',body:'{store} 有人想在介绍 {model} 时，借顾客的地域口音开玩笑。没有保留顾客身份信息，但也不确定对方能否接受。',counter:'内容形式为内部话术讨论，倾向放行，仍需当地人员核实是否冒犯顾客。',final:'reject',manual:'当地培训师确认该用法容易冒犯顾客，本次话术分享应改写后再提交。',topic:'语言与文化'}
  ];
  const fill=(text,market,model)=>text.replaceAll('{store}',market.store).replaceAll('{model}',model);
  function makeRecord(template,offset,slot,channel,changed=false){
    const market=markets[(offset+slot)%markets.length];
    const model=models[(offset*3+slot)%models.length];
    const day=anDayOffset(AN_TODAY,-offset);
    const hour=9+Math.floor(slot/4),minute=(slot*11+offset*3)%50;
    const clock=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');
    const manual=channel==='review';
    const pending=channel==='pending';
    const final=template.final||'allow';
    const leaning=changed?(final==='allow'?'reject':'allow'):final;
    const item={
      id:'demo_'+offset+'_'+slot,type:slot%3===0?'评论':'帖子',
      title:template.title+' · '+market.city+' '+model,
      body:fill(template.body,market,model),topic:template.topic,
      author:market.author+' · '+market.city,country:market.country,store:market.store,
      time:day.slice(5)+' '+clock,audit_at:day+' '+clock,model,
      stats:'点赞 '+((offset*7+slot*3)%25)+' · 评论 '+((offset+slot)%7),
      lean:leaning==='allow'?'放行':'拦截',
      why:changed?template.counter:(template.why||'正常的促销员工作经验分享，未发现适用规则内的风险。'),
      rule:template.rule||'—',rule_id:template.ruleId||null,
      status:pending?'待处理':'已处理',
      ai_decision:manual||pending?'review':final,
      ai_review_leaning:manual||pending?leaning:null
    };
    if(item.type==='评论'){
      item.title=null;
      item.parent='关于 '+model+' 的'+template.topic+'交流';
    }
    if(pending)return item;
    item.handler=manual?market.reviewer:'安小检';
    item.handledAt=day.slice(5)+' '+String(hour).padStart(2,'0')+':'+String(minute+8).padStart(2,'0');
    item.note=template.manual||template.why||'正常工作分享，放行。';
    if(manual)item.manual_result={
      decision:final,reason:template.manual||template.why,
      action:changed?'改判':'采纳',suggestion:'',
      reason_source:'manual_input',reviewer_id:'demo_reviewer_'+market.country
    };
    return item;
  }
  const reviews=[...allowReviews.map(item=>({...item,final:'allow'})),...rejectReviews.map(item=>({...item,final:'reject'}))];
  for(let offset=0;offset<30;offset++){
    const count=offset<7?8:6;
    for(let slot=0;slot<count;slot++){
      const template=reviews[(offset*7+slot*3)%reviews.length];
      const changed=slot===0&&(offset<7||offset%6!==0);
      QUEUE.push(makeRecord(template,offset,slot,'review',changed));
    }
    for(let slot=0;slot<2;slot++)QUEUE.push(makeRecord({...autoAllows[(offset*2+slot)%autoAllows.length],final:'allow'},offset,10+slot,'auto'));
    QUEUE.push(makeRecord({...autoRejects[offset%autoRejects.length],final:'reject'},offset,12,'auto'));
    if(offset%5===0)QUEUE.push(makeRecord(contextReviews[Math.floor(offset/5)%contextReviews.length],offset,13,'review',true));
    if(offset<3){
      QUEUE.push(makeRecord(reviews[(offset*3)%reviews.length],offset,14,'pending'));
      QUEUE.push(makeRecord(reviews[(offset*3+11)%reviews.length],offset,15,'pending'));
    }
  }
}

function ensureExperienceUpdateDemo(){
  const existing=memoryState.runs.find(run=>run.id==='seed_experience_update_demo');
  if(existing?.demo_applied&&existing.version)return;
  // Upgrade the earlier display-only fixture without replaying it after later user edits.
  memoryState.runs=memoryState.runs.filter(run=>run.id!=='seed_experience_update_demo');
  const seed=currentMemory().experiences.find(exp=>!exp.deleted_at&&exp.experience_id==='exp_001')
    ||currentMemory().experiences.find(exp=>!exp.deleted_at&&exp.rule_ids.includes('rule_008'));
  if(!seed)return;
  const item=allLearningCases().find(row=>row.country===seed.scope.markets[0]&&/先查购买记录和门店现行政策/.test(row.body)&&row.reason&&!seed.source_case_refs.some(ref=>refKey(ref)===refKey(caseRef(row))))
    ||allLearningCases().find(row=>seed.source_case_refs.some(ref=>refKey(ref)===refKey(caseRef(row))));
  if(!item)return;
  const before=copyMemory(seed),after=copyMemory(seed),ref=caseRef(item),now=AN_TODAY+' '+currentClock();
  after.guidance=before.guidance+' 核实退换货承诺时，应结合购买记录与门店现行政策确认适用条件；资料不全时不能直接套用历史案例结论。';
  after.limitations=[...new Set([...before.limitations,'缺少购买记录或门店政策依据时，不能直接照搬历史案例结论。'])];
  if(!after.source_case_refs.some(source=>refKey(source)===refKey(ref)))after.source_case_refs.push(ref);
  after.updated_at=now;after.source_run_id='seed_experience_update_demo';
  const base=currentMemory().version,version='memory_'+String(Number(base.split('_').pop())+1).padStart(3,'0');
  currentMemory().experiences=currentMemory().experiences.map(exp=>exp.experience_id===after.experience_id?copyMemory(after):exp);
  currentMemory().version=version;currentMemory().published_at=now;
  memoryState.runs.unshift({id:'seed_experience_update_demo',demo_applied:true,trigger:'demo',started_at:now,finished_at:now,status:'success',result:'changes',base_version:base,version,case_refs:[ref],case_ids:[ref.case_id],changes:[{kind:'update',before,after:copyMemory(after),reason:'人工复核理由强调先核实购买记录和门店政策，再判断是否构成额外承诺，因此补充需要核实的信息与使用边界。'}],case_results:[{...ref,status:'used',reason:'用于补充已有售后经验中的核实条件，不新增经验。'}],summary:'修改 1 条已有经验，补充购买记录、门店政策和不能直接套用的边界，已保存到经验备忘录。'});
}

function normalizeExperienceMetadata(){
  // Normalize earlier local records and historical snapshots to the current country-only scope.
  const normalizeScope=exp=>{if(exp?.scope?.markets)exp.scope={markets:[...exp.scope.markets]};};
  memoryState.runs.forEach(run=>run.changes.forEach(change=>{normalizeScope(change.before);normalizeScope(change.after);}));
  currentMemory().experiences.forEach(exp=>{
    normalizeScope(exp);
    exp.status=exp.status==='inactive'?'inactive':'active';
    exp.created_at=exp.created_at||exp.updated_at;
    exp.status_updated_at=exp.status_updated_at||exp.updated_at;
    exp.deleted_at=exp.deleted_at||null;
    exp.source_run_id=exp.source_run_id||memoryState.runs.find(run=>run.status==='success'&&run.version&&run.changes.some(change=>change.after.experience_id===exp.experience_id))?.id||null;
  });
}

function learningCaseStatus(item){
  const key=refKey(caseRef(item));
  for(const run of memoryState?.runs||[]){
    if(run.demo_only)continue;
    if(!run.case_refs?.some(ref=>refKey(ref)===key))continue;
    if(isRunActive(run))return '处理中';
    if(run.status==='success'){
      const result=run.case_results.find(row=>refKey(row)===key);
      return result?.status==='deferred'?'待补充':'已处理';
    }
  }
  return '待处理';
}

    return `<div role="listitem"><button type="button" class="source-case-button" data-source-case="${escapeReviewText(item.case_id)}"><span class="source-case-title">${escapeReviewText(contentLabel(item))}</span><span class="source-case-meta"><span>${item.kind}</span><span>${knowledgeCaseLabel(knowledgeCaseType(item))}</span><span>${marketName(item.country)}</span><span>${item.ok?'人工放行':'人工拦截'}</span><span>引用修订 ${ref.review_revision}</span></span>${revised?'<span class="source-case-updated">案例已更新，打开后展示最新记录。</span>':''}</button></div>`;
  }).join('')||'<div class="q-empty">暂无来源案例</div>'}</div>${pages>1?`<footer class="source-dialog-footer"><span>第 ${page} / ${pages} 页</span><div><button class="btn sm" id="sourcePrevious" ${page===1?'disabled':''}>上一页</button><button class="btn sm" id="sourceNext" ${page===pages?'disabled':''}>下一页</button></div></footer>`:''}`;
  $('#closeExperienceSources').onclick=()=>dialog.close();
  if($('#sourcePrevious'))$('#sourcePrevious').onclick=()=>openExperienceSources(id,page-1);
  if($('#sourceNext'))$('#sourceNext').onclick=()=>openExperienceSources(id,page+1);
  $$('[data-source-case]').forEach(button=>button.onclick=()=>{
    const item=allLearningCases().find(row=>row.case_id===button.dataset.sourceCase);if(!item)return;
    experienceSourceCaseReturn={id,page,scroll:dialog.querySelector('.source-dialog-body').scrollTop};dialog.close();openKbItem(item);$('#dClose').focus();
  });
  if(!dialog.open)dialog.showModal();dialog.querySelector('.source-dialog-body').scrollTop=0;
}
// The limited demo templates illustrate changes. Unknown cases are deferred, never fabricated.
function buildLearningDraft(run){
  const experiences=copyMemory(currentMemory().experiences),changes=[],outcomes=[];
  for(const ref of run.case_refs){
    const item=allLearningCases().find(row=>row.case_id===ref.case_id);
    const reason=item?.reason?.trim()||'';
    if(!item||!reason||/^人工复核后.*为(放行|拦截)。?$/.test(reason)){
      outcomes.push({...ref,status:'deferred',reason:'缺少可用于提炼的人工理由；补充后再处理。'});continue;
    }
    let family=null;
    if(/先查购买记录和门店现行政策|先承诺摔坏、进水都免费换新|保价|退差价/.test(item.body))family={key:'售后与价格',rule:'rule_008',title:'区分政策说明与超出权限的价格售后承诺',guidance:'涉及价格或售后时，区分依据现行政策说明条件，与作出缺少依据或超出权限的承诺。不能仅凭话题名称作判断。',limitations:['不因内容是请教或内部讨论就自动放行。','有承诺性表述时按正式规则核实依据与权限，不能替代人工复核要求。']};
    if(/看多久都不伤眼|防近视/.test(item.body))family={key:'健康宣称',rule:'rule_007',title:'区分健康承诺与提醒避免使用的措辞',guidance:'出现防近视、看多久都不伤眼等表述时，区分作者是在作出承诺，还是在提醒避免这些说法，结合完整语境按正式规则审核。',limitations:['讨论形式不等于可以放行。','不从个别案例推断产品具有医疗功效。']};
    if(!family){outcomes.push({...ref,status:'deferred',reason:'本交互演示没有为此内容预置总结；真实任务应由模型结合理由提炼。'});continue;}
    let exp=experiences.find(row=>!row.deleted_at&&row.scope.markets.includes(item.country)&&row.rule_ids.includes(family.rule));
    if(exp){
      const original=changes.find(change=>change.after.experience_id===exp.experience_id);
      if(original){
        if(!exp.source_case_refs.some(source=>refKey(source)===refKey(ref)))exp.source_case_refs.push(ref);
        original.after=copyMemory(exp);
      }
      if(!exp.source_case_refs.some(source=>refKey(source)===refKey(ref))){
        // Additions to source lists alone are coverage, not new knowledge.
        if(family.key==='售后与价格'&&!exp.guidance.includes('价格或售后')){
          const before=copyMemory(exp);exp.guidance=family.guidance;exp.title=family.title;exp.limitations=[...new Set([...exp.limitations,...family.limitations])];exp.source_case_refs.push(ref);exp.updated_at=AN_TODAY+' '+currentClock();exp.source_run_id=run.id;
          if(!original)changes.push({kind:'update',before,after:copyMemory(exp),reason:'结合价格承诺案例，补充核实依据与权限的条件。'});
          outcomes.push({...ref,status:'used',reason:'用于补充已有经验的判断条件。'});continue;
        }
      }
      outcomes.push({...ref,status:original?'used':'covered',reason:original?'对应本批已合并的经验。':'当前范围已有经验覆盖，不重复新增。'});
    }else{
      const newExp={status:'active',created_at:AN_TODAY+' '+currentClock(),status_updated_at:AN_TODAY+' '+currentClock(),deleted_at:null,source_run_id:run.id,experience_id:'exp_demo_'+run.id+'_'+changes.length,title:family.title,scope:{markets:[item.country]},guidance:family.guidance,limitations:family.limitations,rule_ids:[family.rule],source_case_refs:[ref],updated_at:AN_TODAY+' '+currentClock()};
      experiences.push(newExp);changes.push({kind:'add',before:null,after:copyMemory(newExp),reason:'补充当前国家尚未覆盖的经验。'});outcomes.push({...ref,status:'used',reason:'用于提炼本批新增经验。'});
    }
  }
  return {experiences,changes,outcomes};
}
function retryLearningRun(id){
  const original=memoryState.runs.find(run=>run.id===id);if(!original||original.status!=='failed'||original.retried_by)return;
  const ids=original.case_ids.filter(id=>allLearningCases().some(item=>item.case_id===id&&learningCaseStatus(item)==='待处理'));
  if(!ids.length){toast('本批已处理或仍待补充信息，暂无可直接重试的案例。');return;}
  startLearningRun(ids,original);
  if(route.v==='learning-run'&&route.id===original.id&&original.retried_by){route={v:'learning-run',id:original.retried_by};learningRunTab='changes';render();$('.main').scrollTop=0;}
}
function refreshLearningUI(){syncAnLearningRecords();if(['learning-run','experience-detail'].includes(route.v)||route.v==='duty'&&route.k==='learn'||route.v==='emp'&&route.id==='an'&&route.tab==='work'&&route.log==='learning')render();}
function startLearningRun(caseIds,original=null){
  if(memoryState.runs.some(isRunActive)){toast('已有经验更新任务在执行，请稍后重试。');return;}
  const cases=allLearningCases().filter(item=>caseIds.includes(item.case_id)&&learningCaseStatus(item)==='待处理');
  const run={id:'run_'+Date.now(),trigger:'manual',retry_of:original?.id||null,started_at:AN_TODAY+' '+currentClock(),status:cases.length?'generating':'success',result:cases.length?null:'no_cases',base_version:currentMemory().version,version:null,case_refs:cases.map(caseRef),case_ids:cases.map(item=>item.case_id),changes:[],case_results:[],summary:cases.length?'正在读取案例并提炼经验。':'无新增案例，未调用模型，当前经验版本不变。'};
  if(!cases.length)run.finished_at=run.started_at;
  memoryState.runs.unshift(run);if(original)original.retried_by=run.id;
  try{persistMemory();}catch{memoryState.runs.shift();if(original)delete original.retried_by;toast('任务保存失败，请重试。');return;}
  refreshLearningUI();if(!cases.length){toast('无新增案例，当前经验版本不变。');return;}
  const draft=buildLearningDraft(run);
  const fail=message=>{run.status='failed';run.version=null;run.error=message;run.summary=message;run.finished_at=AN_TODAY+' '+currentClock();try{persistMemory();}catch{}refreshLearningUI();};
  setTimeout(()=>{
    run.status='saving';run.changes=draft.changes;run.case_results=draft.outcomes;run.summary='经验已生成，正在保存模型返回的结果。';
    try{persistMemory();}catch{fail('学习过程保存失败，请重新学习。');return;}
    refreshLearningUI();
    setTimeout(()=>{
      const before=copyMemory(currentMemory());
      // Save consistency protects later user actions; it does not evaluate experience quality.
      if(currentMemory().version!==run.base_version){fail('学习期间经验发生变化，本次结果未保存，请重新学习。');return;}
      if(run.case_refs.some(ref=>{const item=allLearningCases().find(row=>row.case_id===ref.case_id);return !item||refKey(caseRef(item))!==refKey(ref);})){fail('学习期间案例发生变化，本次结果未保存，请重新学习。');return;}
      run.result=draft.changes.length?'changes':'no_change';run.status='success';run.finished_at=AN_TODAY+' '+currentClock();
      if(draft.changes.length){
        run.version='memory_'+String(Number(before.version.split('_').pop())+1).padStart(3,'0');
        memoryState.memory={version:run.version,published_at:run.finished_at,experiences:draft.experiences};
      }
      const deferred=draft.outcomes.filter(row=>row.status==='deferred').length;
      run.summary=(draft.changes.length?`新增 ${draft.changes.filter(row=>row.kind==='add').length} 条，修改 ${draft.changes.filter(row=>row.kind==='update').length} 条经验。`:'无经验变更，当前生效版本保持不变。')+(deferred?` ${deferred} 条案例待补充，本次未记为已学会。`:'');
      try{persistMemory();}catch{memoryState.memory=before;fail('学习结果保存失败，当前经验保持不变。');return;}
      refreshLearningUI();toast(run.result==='changes'?'经验已保存并生效（演示）。':'处理完成，无经验变更。');
    },950);
  },1700);
}

function renderChange(change){
  const exp=change.after;
  return `<article class="memory-change"><div class="memory-card-title"><h3>${escapeReviewText(exp.title)}</h3>${statusTag(change.kind==='add'?'新增':'修改',change.kind==='add'?'ok':'ai')} ${statusTag(scopeLabel(exp.scope))}</div>${change.kind==='update'?`<div class="memory-compare"><div><span class="review-result-label">更新前</span><p>${escapeReviewText(change.before.guidance)}</p></div><div><span class="review-result-label">更新后</span><p>${escapeReviewText(exp.guidance)}</p></div></div>`:`<p>${escapeReviewText(exp.guidance)}</p>`}<div class="memory-boundary"><span>限制与注意</span>${exp.limitations.map(text=>`<p>${escapeReviewText(text)}</p>`).join('')}</div>${change.reason?`<p class="dnote">变更依据：${escapeReviewText(change.reason)}</p>`:''}</article>`;
}
function learningFailureReason(run){
  const reason=String(run.error||'本次学习未能完成，请稍后重新学习。');
  if(/保存失败/.test(reason))return '学习结果未能保存，请稍后重新学习。';
  if(/基线.*变化|修订.*变化|版本.*变化|经验发生变化|案例发生变化/.test(reason))return '学习期间相关数据发生变化，本次更新已停止。';
  if(/中断/.test(reason))return '上次学习过程中断，未能完成。';
  return reason;
}
function bindLearningRecordBack(){
  $('#backLearning').innerHTML=IC_BACK+(learningRunReturn?.route.v==='emp'?'返回学习日志':learningRunReturn?'返回经验详情':'返回学习记录');
  $('#backLearning').onclick=()=>{if(learningRunReturn){const back=learningRunReturn;learningRunReturn=null;route=back.route;anMarket=back.market;render();$('.main').scrollTop=back.scroll;}else{route={v:'duty',id:'an',k:'learn'};learningTab='runs';render();}};
}
function renderLearningFailure(run){
  const retryable=run.case_ids.some(id=>allLearningCases().some(item=>item.case_id===id&&learningCaseStatus(item)==='待处理'));
  const active=memoryState.runs.some(isRunActive);
  const retry=run.retried_by&&memoryState.runs.find(item=>item.id===run.retried_by);
  let action='';
  if(retry)action=`<button class="btn primary" data-learning-run="${retry.id}">${isRunActive(retry)?'查看学习进度':'查看重试结果'}</button>`;
  else if(retryable)action=`<button class="btn primary" data-learning-retry="${run.id}" ${active?'disabled':''}>${active?'其他学习正在进行':'重新学习'}</button>`;
  else action='<button class="btn primary" id="returnFailureList">返回学习记录</button>';
  $('#wrap').innerHTML=`<button class="back" id="backLearning">${IC_BACK}返回学习记录</button><section class="learning-failure"><div class="learning-failure-symbol" aria-hidden="true">!</div><h1>本次学习失败</h1><p class="learning-failure-meta">${run.started_at} · ${learningTriggerLabel(run)} · ${run.case_refs.length} 条案例</p><div class="learning-failure-reason"><h2>失败原因</h2><p>${escapeReviewText(learningFailureReason(run))}</p></div><p class="learning-failure-impact">${currentMemory().version?'这次学习没有更新经验，现有经验继续生效。':'这次学习没有生成可用经验，审核继续按现行规则进行。'}</p><div class="learning-failure-actions">${action}</div></section>`;
  bindLearningRecordBack();bindLearningLinks();
  if($('#returnFailureList'))$('#returnFailureList').onclick=()=>$('#backLearning').click();
}
function renderLearningRun(){
  if(!['changes','cases'].includes(learningRunTab))learningRunTab='changes';
  const run=memoryState.runs.find(item=>item.id===route.id);if(!run)return;
  if(run.status==='failed'){renderLearningFailure(run);return;}
  const visibleChanges=run.changes;
  const outcomes=run.case_results;
  $('#wrap').innerHTML=`<div class="an-page-toolbar"><button class="back" id="backLearning">${IC_BACK}返回学习记录</button></div><div class="learning-record-heading"><div class="learning-record-title-row"><h1 class="h1">学习记录详情</h1><span class="learning-record-status" aria-label="学习状态：${learningLabels[run.status]}">${statusTag(learningLabels[run.status],run.status==='success'?'ok':run.status==='failed'?'chg':'wait')}</span></div><p class="desc">${run.started_at} · ${learningTriggerLabel(run)} · 全部国家 ${run.case_refs.length} 条案例</p></div>
  <section class="sec"><div class="memory-card-title"><h4>${runResultLabel(run)}</h4>${run.status==='failed'&&!run.retried_by?`<button class="btn sm" data-learning-retry="${run.id}" ${memoryState.runs.some(isRunActive)?'disabled':''}>重试本次任务</button>`:''}${run.retried_by?`<button class="lnk" data-learning-run="${run.retried_by}">查看重试结果 →</button>`:''}</div><p class="memory-summary" aria-live="polite">${escapeReviewText(run.summary)}</p><div class="memory-version-row"><span>${learningMemoryVersionText(run)}</span></div>${run.error?`<p class="memory-error">${escapeReviewText(run.error)}</p>`:''}<p class="dnote">成功表示模型结果已保存；经验为演示数据。</p></section>
  <div class="learning-tabs qtabs">${[['changes','经验变化'],['cases','本批案例']].map(([key,label])=>`<button data-run-tab="${key}" class="${learningRunTab===key?'on':''}">${label}</button>`).join('')}</div>
  <section class="sec">${learningRunTab==='changes'?`<header><h4>${run.status==='success'?'本次经验变化':'经验草稿'}</h4><span class="hint">全部国家 · ${visibleChanges.length} 条</span></header>${visibleChanges.map(renderChange).join('')||`<div class="q-empty">${isRunActive(run)?'正在处理，请稍后查看。':run.result==='no_change'||run.result==='no_cases'?'本次没有经验变更，保留已有经验。':'本次无经验变化。'}</div>`}`:`<header><h4>本批案例处理结果</h4><span class="hint">全部国家 · ${outcomes.length} 条</span></header>${outcomes.map(ref=>{const item=allLearningCases().find(row=>row.case_id===ref.case_id);return `<div class="memory-case-result"><div class="memory-card-title"><button class="lnk learning-case" data-learning-case="${ref.case_id}">${escapeReviewText(item?contentLabel(item):ref.case_id)}</button>${statusTag(run.status==='failed'?'未完成':{used:'用于提炼',covered:'已有经验覆盖',deferred:'待补充'}[ref.status],ref.status==='deferred'?'wait':'')}</div><p class="dnote">${escapeReviewText(ref.reason)} · 修订 ${ref.review_revision}</p></div>`;}).join('')||'<div class="q-empty">当前暂无案例处理结果。</div>'}`}</section>`;
  bindLearningRecordBack();
  $$('[data-run-tab]').forEach(button=>button.onclick=()=>{learningRunTab=button.dataset.runTab;render();});bindLearningLinks();
}

initializeAnRecords();

render();
