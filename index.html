function renderAnHome(preserveFilters=false){
  if(route.log==='learning')return renderAnLearningLog();
  const items=anLogItems();
  const pageCount=Math.max(1,Math.ceil(items.length/10));
  anLogState.page=Math.min(anLogState.page,pageCount);
  const shown=items.slice((anLogState.page-1)*10,anLogState.page*10);
  const summary=anSummary(anRowsBetween(anLogState.from,anLogState.to,anMarket));
  const content=`
    <section class="sec an-growth-card"><header class="an-growth-header">${renderAnGrowthTabs()}<span class="hint">${anLogState.from===anLogState.to?anLogState.from:anLogState.from+' 至 '+anLogState.to}</span></header>
    <div id="anGrowthPanel" role="tabpanel" aria-labelledby="anLog-work"><div class="an-log" id="anLogSection">
      <div class="an-filterbar">
        <div class="seg">${[['today','今天'],['yesterday','昨天'],['week','近 7 天'],['custom','自定义日期']].map(([value,label])=>`<button data-an-range="${value}" class="${anLogState.range===value?'on':''}">${label}</button>`).join('')}</div>
        <select class="qsel" id="anType" aria-label="内容类型">${['全部','帖子','评论'].map(type=>`<option value="${type}" ${type===anLogState.type?'selected':''}>${type==='全部'?'全部类型':type}</option>`).join('')}</select>
        ${marketSelector("anMarket").replace('<span class="filter-label">国家</span>','')}
        <div class="an-search"><input type="search" id="anSearch" aria-label="搜索内容或发布者，即时筛选" placeholder="搜索内容或发布者" value="${escapeReviewText(anLogState.search)}" autocomplete="off"></div>
      </div>
      ${anLogState.range==='custom'?`<form class="an-datebar" id="anDateForm"><label>开始日期<input type="date" id="anFrom" value="${anLogState.from}" max="${AN_TODAY}" required></label><label>结束日期<input type="date" id="anTo" value="${anLogState.to}" max="${AN_TODAY}" required></label><button type="submit" class="btn sm">查询</button><span id="anDateError" role="alert"></span></form>`:''}
      <div class="an-log-summary"><span>本时段审核 <b>${summary.total}</b></span><span>自动放行 <b>${summary.autoAllow}</b></span><span>自动拦截 <b>${summary.autoReject}</b></span><span>转人工 <b>${summary.pool}</b></span></div>
      <div class="an-table-wrap"><table class="an-records"><thead><tr><th>内容</th><th style="width:76px">类型</th><th style="width:148px">审核时间</th><th style="width:112px">处理方式</th><th style="width:96px">最终处置</th><th style="width:96px">处理状态</th><th style="width:70px">操作</th></tr></thead><tbody>
      ${shown.map(item=>{
        const waiting=item.status==='待处理';
        const decision=waiting?null:item.manual_result?.decision||item.ai_decision;
        const method=item.ai_decision==='review'?'人工复核':'AI 处理';
        return `<tr><td><button class="an-record-title ${item.type==='评论'?'an-comment':''}" data-an-item="${item.id}">${escapeReviewText(contentLabel(item))}</button></td><td class="an-content-type">${item.type}</td><td class="an-time">${item.audit_at.slice(5,10)} ${item.audit_at.slice(11)}</td><td>${method}</td><td>${decision?`<span class="lean ${decision==='allow'?'pass':'stop'}">${decision==='allow'?'放行':'拦截'}</span>`:'—'}</td><td><span class="stg ${waiting?'wait':'ok'}">${item.status}</span></td><td><button class="lnk" data-an-item="${item.id}">查看</button></td></tr>`;
      }).join('')||'<tr><td colspan="7" class="q-empty">当前条件下暂无工作记录</td></tr>'}
      </tbody></table></div>
      <div class="an-pagination"><span>共 ${items.length} 条</span><button class="btn sm" id="anPrev" ${anLogState.page===1?'disabled':''}>上一页</button><span>${anLogState.page} / ${pageCount}</span><button class="btn sm" id="anNext" ${anLogState.page===pageCount?'disabled':''}>下一页</button></div>
    </div></div></section>`;
  if(preserveFilters){
    const fragment=document.createElement('div');fragment.innerHTML=content;
    for(const selector of ['#anLogSection .an-table-wrap','#anLogSection .an-pagination']){
      $(selector).replaceWith(fragment.querySelector(selector));
    }
  }else renderAnWorkspace('work',content);
  bindAnGrowthTabs();
  const chooseRange=value=>{
    anLogState.range=value;anLogState.page=1;
    if(value==='today') anLogState.from=anLogState.to=AN_TODAY;
    if(value==='yesterday') anLogState.from=anLogState.to=anDayOffset(AN_TODAY,-1);
    if(value==='week'){anLogState.from=anDayOffset(AN_TODAY,-6);anLogState.to=AN_TODAY;}
    renderAnHome();
  };
  $$('[data-an-range]').forEach(button=>button.onclick=()=>chooseRange(button.dataset.anRange));
  $('#anType').onchange=event=>{anLogState.type=event.target.value;anLogState.page=1;renderAnHome();};
  const searchInput=$('#anSearch');
  if(!searchInput.dataset.liveSearchBound){
    searchInput.dataset.liveSearchBound='true';
    let searchComposing=false;
    const updateSearch=()=>{
      const value=searchInput.value;
      if(value===anLogState.search)return;
      anLogState.search=value;anLogState.page=1;renderAnHome(true);
    };
    searchInput.addEventListener('compositionstart',()=>{searchComposing=true;});
    searchInput.addEventListener('compositionend',()=>{searchComposing=false;updateSearch();});
    searchInput.addEventListener('input',event=>{if(!searchComposing&&!event.isComposing)updateSearch();});
    searchInput.addEventListener('search',()=>{if(!searchComposing)updateSearch();});
    searchInput.addEventListener('change',()=>{if(!searchComposing)updateSearch();});
  }
  if(anLogState.range==='custom') $('#anDateForm').onsubmit=event=>{
    event.preventDefault();
    const from=$('#anFrom').value,to=$('#anTo').value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to)||from>to||to>AN_TODAY){$('#anDateError').textContent='请选择有效的日期范围，结束日期应在今天或之前。';return;}
    anLogState.from=from;anLogState.to=to;anLogState.page=1;renderAnHome();
  };
  $$('[data-an-item]').forEach(button=>button.onclick=()=>openItem(button.dataset.anItem));
  $('#anPrev').onclick=()=>{if(anLogState.page>1){anLogState.page--;renderAnHome();}};
  $('#anNext').onclick=()=>{if(anLogState.page<pageCount){anLogState.page++;renderAnHome();}};
}

function renderAnAnalysis(){
  const employee=EMPLOYEES.find(item=>item.id==='an');
  const days=anDailyRows(anAnalysisDays);
  const records=anRowsBetween(anDayOffset(AN_TODAY,1-anAnalysisDays),AN_TODAY);
  const summary=anSummary(records);
  const points=days.filter(day=>day.rate!==null).reverse().map(day=>({d:day.date.slice(5),v:day.rate}));
  renderAnWorkspace('analysis',`<div class="head an-analysis-toolbar"><div><h4>建议采纳率</h4><p class="desc">衡量 AI 对人工复核的辅助效果。人工采纳 ÷（人工采纳＋人工改判）× 100%，目标 ${employee.metric.target}。</p></div><div class="act seg">${[7,14,30].map(day=>`<button data-an-analysis="${day}" class="${anAnalysisDays===day?'on':''}">近 ${day} 天</button>`).join('')}</div></div>
    <div class="statrow"><div class="sbox"><span>建议采纳率</span><b>${summary.rate===null?'—':summary.rate+'%'}</b></div><div class="sbox"><span>人工采纳</span><b>${summary.adopted}</b><i>条</i></div><div class="sbox"><span>人工改判</span><b>${summary.changed}</b><i>条</i></div></div>
    <section class="sec"><header><h4>采纳率趋势</h4><span class="hint">目标 ${employee.metric.target} · 按首次审核日期归组</span></header>${points.length?chart(points,{target:employee.metric.target_v,unit:'%',gid:'an-analysis'}):'<div class="q-empty">本时段暂无可计算采纳率的人工复核</div>'}</section>
    <section class="sec"><header><h4>每日明细</h4></header><div class="an-table-wrap"><table class="an-records an-metric-table"><thead><tr><th style="width:116px">日期</th><th>审核总数</th><th>AI 审核</th><th>转人工</th><th>人工采纳</th><th>人工改判</th><th>采纳率</th><th style="width:100px">当天状态</th><th style="width:90px">操作</th></tr></thead><tbody>${days.map(day=>`<tr><td>${day.date}</td><td>${day.total}</td><td>${day.autoAllow+day.autoReject}</td><td>${day.pool}</td><td>${day.adopted}</td><td>${day.changed}</td><td>${day.rate===null?'—':day.rate+'%'}</td><td>${day.rate===null?'—':`<span class="pill ${day.rate>=employee.metric.target_v?'on':'warn'}">${day.rate>=employee.metric.target_v?'正常':'低于目标'}</span>`}</td><td><button class="lnk" data-an-day="${day.date}">查看记录</button></td></tr>`).join('')}</tbody></table></div></section>`);
  $$('[data-an-analysis]').forEach(button=>button.onclick=()=>{anAnalysisDays=Number(button.dataset.anAnalysis);renderAnAnalysis();});
  $$('[data-an-day]').forEach(button=>button.onclick=()=>{anMarket='全部';anLogState={range:'custom',from:button.dataset.anDay,to:button.dataset.anDay,search:'',type:'全部',page:1};route={v:'emp',id:'an',tab:'work',log:'work'};render();});
}

  ];
  const contextReviews=[
    {title:'这句方言能不能用于接待顾客',body:'我们在 {store} 介绍 {model} 时，有同事想用一句本地俚语夸顾客。当地人有人觉得亲切，也有人觉得冒犯，想请培训师确认适用场景。',counter:'俚语可能冒犯顾客，倾向拦截，交当地培训师核实使用场景。',final:'allow',manual:'当地培训师确认帖子是在讨论措辞边界，未直接冒犯顾客，可以作为内部交流。',topic:'语言与文化'},
    {title:'转述一句售后争执的话，请帮忙确认语境',body:'{store} 讨论 {model} 售后时，有人把一句不完整的激烈表达贴出来，我想先确认是谁说的，再决定能不能用于培训。',counter:'包含激烈表达，倾向拦截，需要人工核实说话者及完整语境。',final:'allow',manual:'结合门店提供的上下文，作者在说明事件处理经过，并未威胁他人。',topic:'售后沟通'},
    {title:'这条带个人调侃的接待话术先请当地同事看',body:'{store} 有人想在介绍 {model} 时，借顾客的地域口音开玩笑。没有保留顾客身份信息，但也不确定对方能否接受。',counter:'内容形式为内部话术讨论，倾向放行，仍需当地人员核实是否冒犯顾客。',final:'reject',manual:'当地培训师确认该用法容易冒犯顾客，本次话术分享应改写后再提交。',topic:'语言与文化'}
  ];
  const fill=(text,market,model)=>text.replaceAll('{store}',market.store).replaceAll('{model}',model);
  function makeRecord(template,offset,slot,channel,changed=false){
    const market=markets[(offset+slot)%markets.length];
    const model=models[(offset*3+slot)%models.length];
    const day=anDayOffset(AN_TODAY,-offset);
    const hour=9+Math.floor(slot/4),minute=(slot*11+offset*3)%50;
    const clock=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');
    const manual=channel==='review';
    const pending=channel==='pending';
    const final=template.final||'allow';
    const leaning=changed?(final==='allow'?'reject':'allow'):final;
    const item={
      id:'demo_'+offset+'_'+slot,type:slot%3===0?'评论':'帖子',
      title:template.title+' · '+market.city+' '+model,
      body:fill(template.body,market,model),topic:template.topic,
      author:market.author+' · '+market.city,country:market.country,store:market.store,
      time:day.slice(5)+' '+clock,audit_at:day+' '+clock,model,
      stats:'点赞 '+((offset*7+slot*3)%25)+' · 评论 '+((offset+slot)%7),
      lean:leaning==='allow'?'放行':'拦截',
      why:changed?template.counter:(template.why||'正常的促销员工作经验分享，未发现适用规则内的风险。'),
      rule:template.rule||'—',rule_id:template.ruleId||null,
      status:pending?'待处理':'已处理',
      ai_decision:manual||pending?'review':final,
      ai_review_leaning:manual||pending?leaning:null
    };
    if(item.type==='评论'){
      item.title=null;
      item.parent='关于 '+model+' 的'+template.topic+'交流';
    }
    if(pending)return item;
    item.handler=manual?market.reviewer:'安小检';
    item.handledAt=day.slice(5)+' '+String(hour).padStart(2,'0')+':'+String(minute+8).padStart(2,'0');
    item.note=template.manual||template.why||'正常工作分享，放行。';
    if(manual)item.manual_result={
      decision:final,reason:template.manual||template.why,
      action:changed?'改判':'采纳',suggestion:'',
      reason_source:'manual_input',reviewer_id:'demo_reviewer_'+market.country
    };
    return item;
  }
  const reviews=[...allowReviews.map(item=>({...item,final:'allow'})),...rejectReviews.map(item=>({...item,final:'reject'}))];
  for(let offset=0;offset<30;offset++){
    const count=offset<7?8:6;
    for(let slot=0;slot<count;slot++){
      const template=reviews[(offset*7+slot*3)%reviews.length];
      const changed=slot===0&&(offset<7||offset%6!==0);
      QUEUE.push(makeRecord(template,offset,slot,'review',changed));
    }
    for(let slot=0;slot<2;slot++)QUEUE.push(makeRecord({...autoAllows[(offset*2+slot)%autoAllows.length],final:'allow'},offset,10+slot,'auto'));
    QUEUE.push(makeRecord({...autoRejects[offset%autoRejects.length],final:'reject'},offset,12,'auto'));
    if(offset%5===0)QUEUE.push(makeRecord(contextReviews[Math.floor(offset/5)%contextReviews.length],offset,13,'review',true));
    if(offset<3){
      QUEUE.push(makeRecord(reviews[(offset*3)%reviews.length],offset,14,'pending'));
      QUEUE.push(makeRecord(reviews[(offset*3+11)%reviews.length],offset,15,'pending'));
    }
  }
}

}

function marketItems(items){
  return anMarket==='全部'?items:items.filter(item=>item.country===anMarket);
}

function marketSelector(id,disabled=false){
  return `<label class="market-filter" for="${id}"><span class="filter-label">国家</span><select class="qsel" id="${id}" ${disabled?'disabled':''}>${['全部','PH','MY','NG','GH','KE'].map(code=>`<option value="${code}" ${anMarket===code?'selected':''}>${marketName(code)}</option>`).join('')}</select></label>`;

function changeAnMarket(code){

function queueItems(pendingOnly=false){
  return marketItems(QUEUE).filter(item=>item.ai_decision==='review')
    .filter(item=>pendingOnly?item.status==='待处理':qtab==='wait'?item.status==='待处理':qtab==='done'?item.status==='已处理':true)
    .filter(item=>(qModel==='全部'||item.model===qModel)&&(qTopic==='全部'||item.topic===qTopic)&&(qType==='全部'||item.type===qType))

function readStoredReview(item){
  try{return JSON.parse(localStorage.getItem('aibuddy.an.v2.review.'+item.id)||'null');}catch{return null;}
}

function applyStoredReview(item,stored){
  if(!stored||stored.content_version!==(item.version||1)||!['allow','reject'].includes(stored.manual_result?.decision))return;
  item.manual_result=stored.manual_result;item.review_revision=stored.review_revision;
  item.status='已处理';item.handler=stored.handler;item.handledAt=stored.handledAt;item.note=stored.manual_result.reason;
}

function renderReplyContext(item){
  if(item.type!=='评论')return '';

  return `<details class="reply-context"><summary>被回复内容${context?'':' · 尚未提供'}</summary>${context?`<p class="reply-source">${escapeReviewText(context.author)} · ${context.type==='comment'?'评论':'原帖'}</p><p class="review-result-text">${escapeReviewText(context.body)}</p><button class="lnk" id="viewParentPost">查看原帖 →</button>`:'<p class="dwhy">需要补齐被回复内容后，才能结合完整语境判断。</p>'}</details>`;

function openParentPost(item){
  reviewReturn={route:{...route},id:item.id,advice:$('#reviewAdvice')?.value||'',position:$('.main').scrollTop,drawerPosition:$('#dBody').scrollTop};

function renderParentPost(){
  const item=QUEUE.find(record=>record.id===route.id),post=item?.parent_post;if(!post)return;

  bindAttachmentButtons(post);
  $('#backToReview').onclick=()=>{
    const state=reviewReturn;route=state.route;render();$('.main').scrollTop=state.position;
    if(state.caseId)openKbItem([...KB.good,...KB.bad].find(record=>record.case_id===state.caseId));
    else openItem(state.id);
    if($('#reviewAdvice'))$('#reviewAdvice').value=state.advice;
    $('#dBody').scrollTop=state.drawerPosition;
  };
}

function renderAttachments(item){
  const attachments=(item.attachments||[]).map((image,index)=>({...image,index})).filter(image=>/^data:image\/(png|jpeg|webp|svg\+xml);base64,/.test(image.src));
  if(!attachments.length)return '';
  return `<div class="attachment-grid">${attachments.map(image=>`<button data-attachment="${image.index}" aria-label="查看图片 ${image.index+1}"><img src="${image.src}" alt="${escapeReviewText(image.alt||'门店演示图片')}"></button>`).join('')}</div>`;
}

function bindAttachmentButtons(item){
  $$('[data-attachment]').forEach(button=>button.onclick=()=>{

    $('#imagePreviewContent').src=image.src;$('#imagePreviewContent').alt=image.alt||'门店演示图片';$('#imagePreview').hidden=false;
  });
}

function activeRules(){

function initializeLearningRuns(){
  try{
    const saved=JSON.parse(localStorage.getItem(MEMORY_KEY)||'null');
    if(saved?.schema===2&&saved.memory&&Array.isArray(saved.memory.experiences)&&Array.isArray(saved.runs)){
      memoryState=saved;
      memoryState.runs.forEach(run=>{
        if(['checking','publishing'].includes(run.status))run.status='saving';
        delete run.checks;
        // Replace only the old fictional seed failure; retain actual local task results.
        if(run.id==='seed_failed'&&/检查|适用范围被扩大/.test(run.error||'')){
          run.error='模型调用超时，未生成经验，请重新学习。';run.summary='模型调用超时，当前经验保持不变。';
          run.case_results.forEach(row=>row.reason='本次调用未完成，案例可重试。');
        }
        if(isRunActive(run)){run.status='failed';run.error='上次演示执行中断，当前生效经验保持不变。';run.version=null;}
      });
      ensureExperienceUpdateDemo();normalizeExperienceMetadata();ensureLearningStatusDemos();try{persistMemory();}catch{}LEARN.executions=memoryState.runs;return;
    }
  }catch{}
  const cases=allLearningCases();
  const find=(pattern,market)=>cases.find(item=>pattern.test(item.body)&&item.reason&&(!market||item.country===market)&&!item.when.startsWith(AN_TODAY.slice(5)));
  const price=find(/先查购买记录和门店现行政策/,'PH')||find(/先查购买记录和门店现行政策/);

  const quote=find(/说明事件处理经过/ )||cases.find(item=>item.reason?.includes('说明事件处理经过'));
  const picked=[price,screen,quote].filter(Boolean);
  const experience=(id,item,title,guidance,limitations,ruleId)=>({experience_id:id,title,scope:{markets:[item.country]},guidance,limitations,rule_ids:[ruleId],source_case_refs:[caseRef(item)],updated_at:anDayOffset(AN_TODAY,-1)+' 00:02'});
  const experiences=[];
  if(price)experiences.push(experience('exp_001',price,'先区分售后政策说明与额外承诺','涉及退换货时，核对作者是否依据现行门店政策说明适用条件，还是作出超出权限的承诺；不能仅因提及退换货就套用结论。',['本经验不确认门店政策真实有效；需有对应依据。','仍按当前价格与承诺规则处理。'],'rule_008'));
  if(screen)experiences.push(experience('exp_002',screen,'区分健康承诺与提醒避免使用的措辞','出现防近视、看多久都不伤眼等表述时，先判断作者是在作出承诺，还是在提醒同事避免这些说法。',['不能因出现在培训讨论中就一律放行。','本经验不确认任何产品医疗功效。'],'rule_007'));
  if(quote)experiences.push(experience('exp_003',quote,'转述争执时保留说话者和上下文','遇到转述激烈表达的内容，核对说话者、作者立场和事件上下文，再按暴力风险规则判断。',['本案例人工结合补充语境作出结论；缺少同类信息时不能照搬放行。'],'rule_002'));
  const refs=picked.map(caseRef),previous=anDayOffset(AN_TODAY,-1);
  const baseline={id:'seed_published',trigger:'scheduled',started_at:previous+' 00:00',finished_at:previous+' 00:02',status:'success',result:'changes',base_version:null,version:'memory_001',case_refs:refs,case_ids:refs.map(ref=>ref.case_id),changes:experiences.map(exp=>({kind:'add',before:null,after:copyMemory(exp)})),case_results:refs.map(ref=>({...ref,status:'used',reason:'用于提炼当前生效经验。'})),summary:'提炼 '+experiences.length+' 条审核经验，保留适用条件及来源。'};
  const failedRefs=cases.filter(item=>!refs.some(ref=>refKey(ref)===refKey(caseRef(item)))).slice(0,3).map(caseRef);
  const failed={id:'seed_failed',trigger:'scheduled',started_at:AN_TODAY+' 00:00',finished_at:AN_TODAY+' 00:02',status:'failed',result:'blocked',base_version:'memory_001',version:null,case_refs:failedRefs,case_ids:failedRefs.map(ref=>ref.case_id),changes:[],case_results:failedRefs.map(ref=>({...ref,status:'deferred',reason:'本次调用未完成，案例可重试。'})),summary:'模型调用超时，当前经验保持不变。',error:'模型调用超时，未生成经验，请重新学习。'};
  const coveredCase=price&&cases.find(item=>item.country===price.country&&/先查购买记录和门店现行政策/.test(item.body)&&item.case_id!==price.case_id&&!item.when.startsWith(AN_TODAY.slice(5)));
  const unchanged=coveredCase?{id:'seed_unchanged',trigger:'manual',started_at:previous+' 12:00',finished_at:previous+' 12:01',status:'success',result:'no_change',base_version:'memory_001',version:null,case_refs:[caseRef(coveredCase)],case_ids:[coveredCase.case_id],changes:[],case_results:[{...caseRef(coveredCase),status:'covered',reason:'已有经验覆盖政策说明与额外承诺的区别，无需重复新增。'}],summary:'当前经验已覆盖本批案例，没有新增或修改，继续使用经验 v1。'}:null;
  memoryState={schema:2,memory:{version:'memory_001',published_at:previous+' 00:02',experiences},runs:[failed,...(unchanged?[unchanged]:[]),baseline]};
  ensureExperienceUpdateDemo();normalizeExperienceMetadata();ensureLearningStatusDemos();LEARN.executions=memoryState.runs;
  try{persistMemory();}catch{}
}

function ensureExperienceUpdateDemo(){
  const existing=memoryState.runs.find(run=>run.id==='seed_experience_update_demo');
  if(existing?.demo_applied&&existing.version)return;
  // Upgrade the earlier display-only fixture without replaying it after later user edits.
  memoryState.runs=memoryState.runs.filter(run=>run.id!=='seed_experience_update_demo');
  const seed=currentMemory().experiences.find(exp=>!exp.deleted_at&&exp.experience_id==='exp_001')
    ||currentMemory().experiences.find(exp=>!exp.deleted_at&&exp.rule_ids.includes('rule_008'));
  if(!seed)return;
  const item=allLearningCases().find(row=>row.country===seed.scope.markets[0]&&/先查购买记录和门店现行政策/.test(row.body)&&row.reason&&!seed.source_case_refs.some(ref=>refKey(ref)===refKey(caseRef(row))))
    ||allLearningCases().find(row=>seed.source_case_refs.some(ref=>refKey(ref)===refKey(caseRef(row))));
  if(!item)return;
  const before=copyMemory(seed),after=copyMemory(seed),ref=caseRef(item),now=AN_TODAY+' '+currentClock();
  after.guidance=before.guidance+' 核实退换货承诺时，应结合购买记录与门店现行政策确认适用条件；资料不全时不能直接套用历史案例结论。';
  after.limitations=[...new Set([...before.limitations,'缺少购买记录或门店政策依据时，不能直接照搬历史案例结论。'])];
  if(!after.source_case_refs.some(source=>refKey(source)===refKey(ref)))after.source_case_refs.push(ref);
  after.updated_at=now;after.source_run_id='seed_experience_update_demo';
  const base=currentMemory().version,version='memory_'+String(Number(base.split('_').pop())+1).padStart(3,'0');
  currentMemory().experiences=currentMemory().experiences.map(exp=>exp.experience_id===after.experience_id?copyMemory(after):exp);
  currentMemory().version=version;currentMemory().published_at=now;
  memoryState.runs.unshift({id:'seed_experience_update_demo',demo_applied:true,trigger:'demo',started_at:now,finished_at:now,status:'success',result:'changes',base_version:base,version,case_refs:[ref],case_ids:[ref.case_id],changes:[{kind:'update',before,after:copyMemory(after),reason:'人工复核理由强调先核实购买记录和门店政策，再判断是否构成额外承诺，因此补充需要核实的信息与使用边界。'}],case_results:[{...ref,status:'used',reason:'用于补充已有售后经验中的核实条件，不新增经验。'}],summary:'修改 1 条已有经验，补充购买记录、门店政策和不能直接套用的边界，已保存到经验备忘录。'});
}

function normalizeExperienceMetadata(){
  // Normalize earlier local records and historical snapshots to the current country-only scope.
  const normalizeScope=exp=>{if(exp?.scope?.markets)exp.scope={markets:[...exp.scope.markets]};};
  memoryState.runs.forEach(run=>run.changes.forEach(change=>{normalizeScope(change.before);normalizeScope(change.after);}));
  currentMemory().experiences.forEach(exp=>{
    normalizeScope(exp);
    exp.status=exp.status==='inactive'?'inactive':'active';
    exp.created_at=exp.created_at||exp.updated_at;
    exp.status_updated_at=exp.status_updated_at||exp.updated_at;
    exp.deleted_at=exp.deleted_at||null;
    exp.source_run_id=exp.source_run_id||memoryState.runs.find(run=>run.status==='success'&&run.version&&run.changes.some(change=>change.after.experience_id===exp.experience_id))?.id||null;
  });
}

function learningCaseStatus(item){
  const key=refKey(caseRef(item));
  for(const run of memoryState?.runs||[]){
    if(run.demo_only)continue;
    if(!run.case_refs?.some(ref=>refKey(ref)===key))continue;
    if(isRunActive(run))return '处理中';
    if(run.status==='success'){
      const result=run.case_results.find(row=>refKey(row)===key);
      return result?.status==='deferred'?'待补充':'已处理';
    }
  }
  return '待处理';
}

function commitExperienceManagement(change,message){
  const before=copyMemory(currentMemory()),scroll=$('.main').scrollTop,now=AN_TODAY+' '+currentClock();
  change(now);
  currentMemory().version='memory_'+String(Number(before.version.split('_').pop())+1).padStart(3,'0');

// The limited demo templates illustrate changes. Unknown cases are deferred, never fabricated.
function buildLearningDraft(run){
  const experiences=copyMemory(currentMemory().experiences),changes=[],outcomes=[];
  for(const ref of run.case_refs){
    const item=allLearningCases().find(row=>row.case_id===ref.case_id);
    const reason=item?.reason?.trim()||'';
    if(!item||!reason||/^人工复核后.*为(放行|拦截)。?$/.test(reason)){
      outcomes.push({...ref,status:'deferred',reason:'缺少可用于提炼的人工理由；补充后再处理。'});continue;
    }
    let family=null;
    if(/先查购买记录和门店现行政策|先承诺摔坏、进水都免费换新|保价|退差价/.test(item.body))family={key:'售后与价格',rule:'rule_008',title:'区分政策说明与超出权限的价格售后承诺',guidance:'涉及价格或售后时，区分依据现行政策说明条件，与作出缺少依据或超出权限的承诺。不能仅凭话题名称作判断。',limitations:['不因内容是请教或内部讨论就自动放行。','有承诺性表述时按正式规则核实依据与权限，不能替代人工复核要求。']};
    if(/看多久都不伤眼|防近视/.test(item.body))family={key:'健康宣称',rule:'rule_007',title:'区分健康承诺与提醒避免使用的措辞',guidance:'出现防近视、看多久都不伤眼等表述时，区分作者是在作出承诺，还是在提醒避免这些说法，结合完整语境按正式规则审核。',limitations:['讨论形式不等于可以放行。','不从个别案例推断产品具有医疗功效。']};
    if(!family){outcomes.push({...ref,status:'deferred',reason:'本交互演示没有为此内容预置总结；真实任务应由模型结合理由提炼。'});continue;}
    let exp=experiences.find(row=>!row.deleted_at&&row.scope.markets.includes(item.country)&&row.rule_ids.includes(family.rule));
    if(exp){
      const original=changes.find(change=>change.after.experience_id===exp.experience_id);
      if(original){
        if(!exp.source_case_refs.some(source=>refKey(source)===refKey(ref)))exp.source_case_refs.push(ref);
        original.after=copyMemory(exp);
      }
      if(!exp.source_case_refs.some(source=>refKey(source)===refKey(ref))){
        // Additions to source lists alone are coverage, not new knowledge.
        if(family.key==='售后与价格'&&!exp.guidance.includes('价格或售后')){
          const before=copyMemory(exp);exp.guidance=family.guidance;exp.title=family.title;exp.limitations=[...new Set([...exp.limitations,...family.limitations])];exp.source_case_refs.push(ref);exp.updated_at=AN_TODAY+' '+currentClock();exp.source_run_id=run.id;
          if(!original)changes.push({kind:'update',before,after:copyMemory(exp),reason:'结合价格承诺案例，补充核实依据与权限的条件。'});
          outcomes.push({...ref,status:'used',reason:'用于补充已有经验的判断条件。'});continue;
        }
      }
      outcomes.push({...ref,status:original?'used':'covered',reason:original?'对应本批已合并的经验。':'当前范围已有经验覆盖，不重复新增。'});
    }else{
      const newExp={status:'active',created_at:AN_TODAY+' '+currentClock(),status_updated_at:AN_TODAY+' '+currentClock(),deleted_at:null,source_run_id:run.id,experience_id:'exp_demo_'+run.id+'_'+changes.length,title:family.title,scope:{markets:[item.country]},guidance:family.guidance,limitations:family.limitations,rule_ids:[family.rule],source_case_refs:[ref],updated_at:AN_TODAY+' '+currentClock()};
      experiences.push(newExp);changes.push({kind:'add',before:null,after:copyMemory(newExp),reason:'补充当前国家尚未覆盖的经验。'});outcomes.push({...ref,status:'used',reason:'用于提炼本批新增经验。'});
    }
  }
  return {experiences,changes,outcomes};
}

function startLearningRun(caseIds,original=null){
  if(memoryState.runs.some(isRunActive)){toast('已有经验更新任务在执行，请稍后重试。');return;}
  const cases=allLearningCases().filter(item=>caseIds.includes(item.case_id)&&learningCaseStatus(item)==='待处理');
  const run={id:'run_'+Date.now(),trigger:'manual',retry_of:original?.id||null,started_at:AN_TODAY+' '+currentClock(),status:'running',result:null,base_version:currentMemory().version,version:null,case_refs:cases.map(caseRef),case_ids:cases.map(item=>item.case_id),changes:[],case_results:[],summary:'正在更新经验，请稍候。'};
  memoryState.runs.unshift(run);if(original)original.retried_by=run.id;
  try{persistMemory();}catch{memoryState.runs.shift();if(original)delete original.retried_by;toast('任务保存失败，请重试。');return;}
  refreshLearningUI();
  // One loading state for the entire 10-second interaction demo.
  const draft=cases.length?buildLearningDraft(run):{experiences:copyMemory(currentMemory().experiences),changes:[],outcomes:[]};
  const fail=message=>{run.status='failed';run.version=null;run.error=message;run.summary=message;run.finished_at=AN_TODAY+' '+currentClock();try{persistMemory();}catch{}refreshLearningUI();};
  setTimeout(()=>{
      const before=copyMemory(currentMemory());
      // Save consistency protects later user actions; it does not evaluate experience quality.
      if(currentMemory().version!==run.base_version){fail('学习期间经验发生变化，本次结果未保存，请重新学习。');return;}
      if(run.case_refs.some(ref=>{const item=allLearningCases().find(row=>row.case_id===ref.case_id);return !item||refKey(caseRef(item))!==refKey(ref);})){fail('学习期间案例发生变化，本次结果未保存，请重新学习。');return;}
      run.changes=draft.changes;run.case_results=draft.outcomes;
      run.result=!cases.length?'no_cases':draft.changes.length?'changes':'no_change';run.status='success';run.finished_at=AN_TODAY+' '+currentClock();
      if(draft.changes.length){
        run.version='memory_'+String(Number(before.version.split('_').pop())+1).padStart(3,'0');
        memoryState.memory={version:run.version,published_at:run.finished_at,experiences:draft.experiences};
      }
      const deferred=draft.outcomes.filter(row=>row.status==='deferred').length;
      run.summary=!cases.length?'无新增案例，未调用模型，当前经验版本不变。':(draft.changes.length?`新增 ${draft.changes.filter(row=>row.kind==='add').length} 条，修改 ${draft.changes.filter(row=>row.kind==='update').length} 条经验。`:'无经验变更，当前生效版本保持不变。')+(deferred?` ${deferred} 条案例待补充，本次未记为已学会。`:'');
      try{persistMemory();}catch{memoryState.memory=before;fail('学习结果保存失败，当前经验保持不变。');return;}
      refreshLearningUI();toast(run.result==='changes'?'经验已保存并生效（演示）。':'处理完成，无经验变更。');
  },10000);
}

  <section class="sec"><div class="memory-card-title"><h4>${runResultLabel(run)}</h4>${run.status==='failed'&&!run.retried_by?`<button class="btn sm" data-learning-retry="${run.id}" ${memoryState.runs.some(isRunActive)?'disabled':''}>重试本次任务</button>`:''}${run.retried_by?`<button class="lnk" data-learning-run="${run.retried_by}">查看重试结果 →</button>`:''}</div><p class="memory-summary" aria-live="polite">${escapeReviewText(run.summary)}</p><div class="memory-version-row"><span>${learningMemoryVersionText(run)}</span></div>${run.error?`<p class="memory-error">${escapeReviewText(run.error)}</p>`:''}<p class="dnote">成功表示模型结果已保存；经验为演示数据。</p></section>
  <div class="learning-tabs qtabs">${[['changes','经验变化'],['cases','本批案例']].map(([key,label])=>`<button data-run-tab="${key}" class="${learningRunTab===key?'on':''}">${label}</button>`).join('')}</div>
  <section class="sec">${learningRunTab==='changes'?`<header><h4>${run.status==='success'?'本次经验变化':'经验草稿'}</h4><span class="hint">全部国家 · ${visibleChanges.length} 条</span></header>${visibleChanges.map(renderChange).join('')||`<div class="q-empty">${isRunActive(run)?'正在处理，请稍后查看。':run.result==='no_change'||run.result==='no_cases'?'本次没有经验变更，保留已有经验。':'本次无经验变化。'}</div>`}`:`<header><h4>本批案例</h4><span class="hint">全部国家 · ${batchCases.length} 条</span></header>${batchCases.map(ref=>{const item=allLearningCases().find(row=>row.case_id===ref.case_id);return `<div class="memory-case-result"><div class="memory-card-title"><button class="lnk learning-case" data-learning-case="${escapeReviewText(ref.case_id)}">${escapeReviewText(item?contentLabel(item):ref.case_id)}</button></div></div>`;}).join('')||'<div class="q-empty">本次未纳入案例。</div>'}`}</section>`;
  bindLearningRecordBack();
  $$('[data-run-tab]').forEach(button=>button.onclick=()=>{learningRunTab=button.dataset.runTab;render();});bindLearningLinks();
}

initializeAnRecords();

render();

/* 关键屏声明（评审截图用） */
window.__UI_CAPTURE__={reset:async()=>{teamGroup='all';route={v:'team'};render();
  $('#drawer').classList.remove('on');$('#modal').classList.remove('on');$('#scrim').classList.remove('on');},
  states:[
    {id:'team',label:'团队总览',go:async()=>{route={v:'team'};render();}},
    {id:'emp',label:'员工工作台',go:async()=>{route={v:'emp',id:'an'};render();}},
    {id:'day',label:'每日下钻',go:async()=>{route={v:'emp',id:'an'};render();openDay(EMPLOYEES[0],'2026-11-15');}},
    {id:'emp2',label:'切换另一位员工',go:async()=>{route={v:'emp',id:'chuan'};render();}},
    {id:'team-group',label:'数字员工·按组看',go:async()=>{teamGroup='engage';route={v:'team'};render();}},
    {id:'queue-all',label:'核检台·全部帖子',go:async()=>{qtab='all';qFrom='nav';route={v:'queue'};render();}},
    {id:'queue',label:'核检台·待处理',go:async()=>{route={v:'queue'};qtab='wait';render();}},
    {id:'queue2',label:'核检台·已处理',go:async()=>{route={v:'queue'};qtab='done';render();}},
    {id:'item',label:'单条内容详情',go:async()=>{route={v:'queue'};qtab='wait';render();openItem('q3');}},
    {id:'d-risk',label:'职责·风险规则',go:async()=>{route={v:'duty',id:'an',k:'risk'};render();}},
    {id:'d-kb',label:'职责·知识库',go:async()=>{route={v:'duty',id:'an',k:'kb'};kbtab='all';render();}},
    {id:'d-kb2',label:'职责·知识库(负向案例)',go:async()=>{route={v:'duty',id:'an',k:'kb'};kbtab='bad';render();}},
    {id:'d-learn',label:'自主学习·经验备忘录',go:async()=>{route={v:'duty',id:'an',k:'learn'};render();}},
    {id:'learning-runs',label:'成长日志·学习日志',go:async()=>{openAnLearningLog();}},
    {id:'tpl',label:'指标模板',go:async()=>{route={v:'tpl'};render();}},
    {id:'new',label:'新增员工',go:async()=>{route={v:'team'};render();openNew();}}
  ]};
</script>
